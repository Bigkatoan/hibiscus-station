# Secret scanning of the full history (push) or the PR range, with the pinned gitleaks image.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          if [ -n "$BASE" ]; then range=("--log-opts=${BASE}..${HEAD}"); fi
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/repo -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --verbose "${range[@]}"
