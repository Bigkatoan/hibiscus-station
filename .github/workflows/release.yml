# On a version tag (v0.2.0, v0.3.0-rc.1, ...): build the wheel and sdist (UI included) and create the
# GitHub release with the matching CHANGELOG.md section as notes. Images: docker.yml, same tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      NODE_VERSION: "22.12.0"
      PNPM_VERSION: "9.15.0"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag matches the package version
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^__version__ = \"$v\"$" hibiscus_station/__init__.py || { echo "::error::tag $GITHUB_REF_NAME != hibiscus_station.__version__"; exit 1; }
      - uses: pnpm/action-setup@v6.1.1
        with: {version: "${{ env.PNPM_VERSION }}"}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Build the UI, the sdist and the wheel
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm build)
          uv build --out-dir dist
          ls -l dist
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found && /^\[[^]]+\]: / {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error file=CHANGELOG.md::no '## [$version]' section in CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo
            echo "- Docker: \`bash install.sh --version $version\` ([deploy guide](https://github.com/Bigkatoan/hibiscus-station/blob/$GITHUB_REF_NAME/docs/deploy.md))"
            for i in cpu cuda jetson; do
              echo "- \`ghcr.io/bigkatoan/hibiscus-station:$version-$i\`"
            done
            echo "- Wheel: \`uv tool install https://github.com/Bigkatoan/hibiscus-station/releases/download/$GITHUB_REF_NAME/hibiscus_station-$version-py3-none-any.whl\`"
          } >> RELEASE_NOTES.md
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          cat RELEASE_NOTES.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          flags=(--title "Hibiscus Station ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/*.whl dist/*.tar.gz deploy/install.sh
