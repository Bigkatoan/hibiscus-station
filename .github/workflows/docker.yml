# Build and publish the Hibiscus Station images to GHCR on version tags:
#   ghcr.io/bigkatoan/hibiscus-station:<version>-{cpu,cuda,jetson} (the PEP 440 version of the tag:
#   1.0.2-cpu, 1.0.0a1-cpu), plus X.Y-<variant> and :{cpu,cuda,jetson} for a stable release only.
#   cpu is multi-arch (linux/amd64 + linux/arm64); jetson builds on a native arm64 runner. Build arguments mirror docker/build.sh (keep them in sync).
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the images (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bigkatoan/hibiscus-station

jobs:
  image:
    name: ${{ matrix.variant }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            runner: ubuntu-24.04
            platforms: linux/amd64,linux/arm64
            file: docker/Dockerfile
            build-args: |
              RUNTIME_BASE=debian:trixie-slim
              TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
              TORCH_PACKAGES=torch==2.15.0+cpu torchvision==0.29.1+cpu torchcodec==0.17.0+cpu
          - variant: cuda
            runner: ubuntu-24.04
            platforms: linux/amd64
            file: docker/Dockerfile
            build-args: |
              RUNTIME_BASE=nvidia/cuda:13.2.0-base-ubuntu24.04
              TORCH_INDEX_URL=https://pypi.org/simple
              TORCH_PACKAGES=torch==2.15.0 torchvision==0.29.2 torchcodec==0.17.0
          - variant: jetson
            runner: ubuntu-24.04-arm
            platforms: linux/arm64
            file: docker/Dockerfile.jetson
            build-args: |
              JETSON_BASE=nvcr.io/nvidia/pytorch:26.02-py3-igpu
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space (CUDA / NGC base layers)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - id: version
        # The tag is a PEP 440 version (v1.0.2, v1.0.0a1). Its image tag is that exact string
        # (1.0.0a1-cpu, as README / install.sh / .env.example name it), not the semver form
        # docker/metadata-action would make (1.0.0-a1). The floating tags X.Y-<variant> and
        # <variant> move only for a stable release: a pre-release never becomes "latest" (QD-1).
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then v="0.0.0-dev+${GITHUB_SHA::7}"; fi
          stable=false
          if [[ "$GITHUB_REF" == refs/tags/v* && "$v" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then stable=true; fi
          {
            echo "version=$v"
            echo "tagged=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo true || echo false)"
            echo "stable=$stable"
            echo "minor=${v%.*}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, ',')
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push' || inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-${{ matrix.variant }},enable=${{ steps.version.outputs.tagged }}
            type=raw,value=${{ steps.version.outputs.minor }}-${{ matrix.variant }},enable=${{ steps.version.outputs.stable }}
            type=raw,value=${{ matrix.variant }},enable=${{ steps.version.outputs.stable }}
            type=sha,format=short,suffix=-${{ matrix.variant }}
          labels: |
            org.opencontainers.image.title=hibiscus-station
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            io.github.bigkatoan.hibiscus-station.variant=${{ matrix.variant }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v4
        if: github.event_name == 'push' || inputs.push
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
