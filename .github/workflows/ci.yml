# Hibiscus Station CI. Every job is also runnable locally through the Makefile (`make check`,
# `make e2e`, `make shellcheck`, `make image`). No GPU and no robot here: the tests use the mocks.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.12.0"
  PNPM_VERSION: "9.15.0"
  FORCE_COLOR: "1"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  python:
    name: python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space (torch / LeRobot wheels)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync
        run: uv lock --check && uv sync --locked --python "$PYTHON_VERSION"
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy (strict; Linux, plus the Windows and macOS branches)
        run: |
          uv run mypy --strict hibiscus_station
          uv run mypy --strict --platform win32 hibiscus_station
          uv run mypy --strict --platform darwin hibiscus_station
      - name: Tests (mock hardware, CPU)
        run: uv run pytest -q
      - name: openapi.json up to date
        run: uv run hibiscus-station openapi /tmp/station-openapi.json && diff -u openapi.json /tmp/station-openapi.json

  web:
    name: web (eslint, prettier, tsc, vitest, build + CSP check)
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with: {version: "${{ env.PNPM_VERSION }}"}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Generated API types match openapi.json
        run: pnpm check:api
      - run: pnpm coverage
      - name: Build (fails on eval / new Function in the bundle)
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with: {name: web-dist, path: web/dist, retention-days: 7}

  e2e:
    name: e2e (Playwright, hibiscus-station --mock)
    runs-on: ubuntu-24.04
    needs: [web]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space (torch / LeRobot wheels)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v8
        with: {name: web-dist, path: web/dist}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --python "$PYTHON_VERSION" && uv run playwright install --with-deps chromium
      - run: uv run pytest -q tests/e2e -m e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: e2e-screenshots, path: screenshots/e2e, retention-days: 7, if-no-files-found: ignore}

  wheel:
    name: wheel (build, install, smoke)
    runs-on: ubuntu-24.04
    needs: [web]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with: {name: web-dist, path: web/dist}
      - uses: astral-sh/setup-uv@v10.3.3
        with: {version: "${{ env.UV_VERSION }}"}
      - run: uv build --out-dir dist
      - name: uv tool install (CPU torch) and serve the UI in mock mode
        run: |
          uv tool install --python "$PYTHON_VERSION" --torch-backend cpu dist/*.whl
          hibiscus-station --version
          hibiscus-station --mock --no-browser --port 18210 --home "$RUNNER_TEMP/station" &
          for _ in $(seq 60); do hibiscus-station health --home "$RUNNER_TEMP/station" && break; sleep 2; done
          curl -fsS http://127.0.0.1:18210/ | grep -q "<title>Hibiscus Station</title>"
          kill %1
      - uses: actions/upload-artifact@v7
        with: {name: dist, path: dist, retention-days: 7}

  windows:
    name: windows (pytest, wheel build, uv tool install smoke)
    runs-on: windows-latest
    needs: [web]
    defaults:
      run: {shell: pwsh}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with: {name: web-dist, path: web/dist}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync
        run: uv sync --locked --python "$env:PYTHON_VERSION"
      - name: Tests (mock hardware, CPU)
        run: uv run pytest -q -ra
      - name: Build the wheel (UI included)
        run: uv build --out-dir dist
      - name: uv tool install (CPU torch) and serve the UI in mock mode
        run: |
          $wheel = (Get-Item dist\*.whl).FullName
          uv tool install --python "$env:PYTHON_VERSION" --torch-backend cpu "$wheel"
          $env:PATH = "$(uv tool dir --bin);$env:PATH"
          hibiscus-station --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (hibiscus-station --help | Out-String).Contains("COM3")) { Write-Error "--help: no COM ports"; exit 1 }
          $home_ = Join-Path $env:RUNNER_TEMP "station"
          $out = Join-Path $env:RUNNER_TEMP "station-out.log"
          $err = Join-Path $env:RUNNER_TEMP "station-err.log"
          $proc = Start-Process -FilePath (Get-Command hibiscus-station).Source -PassThru -NoNewWindow `
            -ArgumentList "--mock", "--no-browser", "--port", "18210", "--home", $home_ `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $ok = $false
          foreach ($i in 1..90) {
            hibiscus-station health --home "$home_"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Get-Content $out, $err -ErrorAction SilentlyContinue; exit 1 }
          $index = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18210/
          if ($index.Content -notmatch "<title>Hibiscus Station</title>") { Write-Error "no UI index"; exit 1 }
          $js = [regex]::Match($index.Content, 'src="(/assets/[^"]+\.js)"').Groups[1].Value
          $asset = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18210$js"
          Write-Output "$js -> $($asset.Headers['Content-Type'])"
          if ("$($asset.Headers['Content-Type'])" -notmatch "javascript") { Write-Error "bad JS MIME type"; exit 1 }
          hibiscus-station url --home "$home_" | Select-String "auth\?t="
          Stop-Process -Id $proc.Id -Force
          Get-Content $out, $err -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        with: {name: dist-windows, path: dist, retention-days: 7}

  macos:
    name: macos (uv tool install smoke)
    runs-on: macos-latest
    needs: [wheel]
    steps:
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist}
      - uses: astral-sh/setup-uv@v10.3.3
        with: {version: "${{ env.UV_VERSION }}"}
      - name: uv tool install (CPU torch) and serve the UI in mock mode
        run: |
          uv tool install --python "$PYTHON_VERSION" --torch-backend cpu dist/*.whl
          hibiscus-station --version
          hibiscus-station --mock --no-browser --port 18210 --home "$RUNNER_TEMP/station" &
          for _ in $(seq 90); do hibiscus-station health --home "$RUNNER_TEMP/station" && break; sleep 2; done
          curl -fsS http://127.0.0.1:18210/ | grep -q "<title>Hibiscus Station</title>"
          kill %1

  deploy-lint:
    name: deploy (shellcheck, hadolint, compose, actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck
        run: make shellcheck
      - name: hadolint
        run: |
          for f in docker/Dockerfile docker/Dockerfile.jetson; do
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --ignore DL3008 --ignore DL3013 - < "$f"
          done
      - name: Compose files render
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config -q
          COMPOSE_FILE=compose.yml:compose.cuda.yml docker compose config -q
          COMPOSE_FILE=compose.yml:compose.jetson.yml docker compose config -q
      - name: install.sh dry run
        run: bash deploy/install.sh --dry-run --yes --variant cpu --no-udev --no-start
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  image:
    name: image (cpu, linux/amd64, smoke test)
    runs-on: ubuntu-24.04
    needs: [deploy-lint]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: docker/build.sh cpu --platform linux/amd64 --tag hibiscus-station:ci
      - name: Run with --mock until healthy
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/cal"
          docker run -d --name station --network host --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/cal:/calibration" hibiscus-station:ci --no-browser --mock
          for _ in $(seq 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' station)" = healthy ] && break; sleep 3; done
          docker inspect -f '{{.State.Health.Status}}' station | grep -qx healthy
          curl -fsS http://127.0.0.1:18210/ | grep -q "<title>Hibiscus Station</title>"
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hibiscus-station:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          scanners: vuln,secret
