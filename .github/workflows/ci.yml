# Hibiscus Station CI. Every job is also runnable locally through the Makefile (`make check`,
# `make e2e`, `make shellcheck`, `make image`) or tools/release/dry_run.sh (release assets and the
# install). No GPU and no robot here: the tests use the mocks.
name: ci

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22.12.0"
  PNPM_VERSION: "9.15.0"
  FORCE_COLOR: "1"
  CUDA_VISIBLE_DEVICES: ""

jobs:
  python:
    # NFR-18 / AT-2: the full non-hardware suite on the three platforms, for the exact commit. Every
    # SKIPPED test must be in tools/ci/allowed-skips.toml for that platform (check_skips.py).
    name: python (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux}
          - {os: windows-latest, platform: windows}
          - {os: macos-latest, platform: macos}
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space (torch / LeRobot wheels)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync
        run: uv lock --check && uv sync --locked --python "$PYTHON_VERSION"
      - name: Ruff
        if: runner.os == 'Linux'
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy (strict; Linux, plus the Windows and macOS branches; release tools)
        if: runner.os == 'Linux'
        run: |
          uv run mypy --strict hibiscus_station
          uv run mypy --strict --platform win32 hibiscus_station
          uv run mypy --strict --platform darwin hibiscus_station
          uv run mypy --strict tools/release tools/ci
      - name: One version everywhere (FR-76)
        if: runner.os == 'Linux'
        run: uv run python tools/release/check_versions.py
      - name: Honest timers on the macOS runner VM (QD-7)
        # The VM coalesces kernel timers: time.sleep(1/30) loops ran at 14 Hz and 1/120 at 32 Hz,
        # 29.5 Hz and 101 Hz with coalescing off (probe run 44051390958). The control-loop timing
        # tests keep the Linux thresholds; the runner's timers are made honest instead.
        if: runner.os == 'macOS'
        run: sudo sysctl -w kern.timer.coalescing_enabled=0
      - name: A second loopback address on macOS, as Linux and Windows have (LAN-mode test)
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Tests (mock hardware, CPU)
        run: uv run pytest -q -ra --junitxml=pytest-junit.xml
      - name: Skipped tests are in the published list (NFR-18)
        if: ${{ !cancelled() && hashFiles('pytest-junit.xml') != '' }}
        run: uv run python tools/ci/check_skips.py --platform "${{ matrix.platform }}" pytest-junit.xml
      - name: openapi.json up to date
        if: runner.os == 'Linux'
        run: uv run hibiscus-station openapi "$RUNNER_TEMP/station-openapi.json" && diff -u openapi.json "$RUNNER_TEMP/station-openapi.json"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with: {name: "pytest-${{ matrix.platform }}", path: pytest-junit.xml, retention-days: 30, if-no-files-found: ignore}

  web:
    name: web (eslint, prettier, tsc, vitest, build + CSP check)
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with: {version: "${{ env.PNPM_VERSION }}"}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Generated API types match openapi.json
        run: pnpm check:api
      - run: pnpm coverage
      - name: Build (fails on eval / new Function in the bundle)
        run: pnpm build
      - uses: actions/upload-artifact@v5
        with: {name: web-dist, path: web/dist, retention-days: 7}

  e2e:
    # D-1 / FL-7 / BR-1 / AT-2: the built UI against a real `hibiscus-station --mock`, in the browsers
    # AT-2 names: Linux Chromium (the whole suite: novice flows in vi and en, the STS3215-emulator
    # flow, the screen matrix with scroll + axe checks) and Linux Firefox (the flows), windows-latest
    # Microsoft Edge (the flows; the emulator needs pseudo-terminals, listed in
    # tools/ci/allowed-skips.toml). The screen matrix runs in Chromium only: its baseline is one
    # engine's layout on Linux fonts. HIBISCUS_E2E_BROWSER picks the browser (chromium | firefox |
    # msedge = the Edge installed on the runner). A missing browser, UI build or axe-core fails the
    # job instead of skipping (HIBISCUS_E2E_REQUIRED=1).
    name: e2e (${{ matrix.platform }}, ${{ matrix.browser }}, Playwright, hibiscus-station --mock)
    runs-on: ${{ matrix.os }}
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, browser: chromium, tests: tests/e2e, install: "--with-deps chromium"}
          - {os: ubuntu-24.04, platform: linux, browser: firefox, tests: tests/e2e/test_station_ui.py, install: "--with-deps firefox"}
          - {os: windows-latest, platform: windows, browser: msedge, tests: tests/e2e/test_station_ui.py, install: ""}
    defaults:
      run: {shell: bash}
    env:
      HIBISCUS_E2E_REQUIRED: "1"
      HIBISCUS_E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space (torch / LeRobot wheels)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v6
        with: {name: web-dist, path: web/dist}
      - uses: pnpm/action-setup@v6.1.1
        with: {version: "${{ env.PNPM_VERSION }}"}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: axe-core for the screen matrix (web/node_modules)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync, and the browser for Playwright (Edge is the one installed on windows-latest)
        run: |
          uv sync --locked --python "$PYTHON_VERSION"
          if [ -n "${{ matrix.install }}" ]; then uv run playwright install ${{ matrix.install }}; fi
      - name: The e2e fixtures launch the browser this job names (AT-2)
        if: matrix.browser != 'chromium'
        run: |
          grep -q HIBISCUS_E2E_BROWSER tests/e2e/conftest.py || {
            echo "::error::tests/e2e/conftest.py ignores HIBISCUS_E2E_BROWSER: this job would test Chromium, not $HIBISCUS_E2E_BROWSER"
            exit 1
          }
      - run: uv run pytest -q -ra "${{ matrix.tests }}" -m e2e --junitxml=e2e-junit.xml
      - name: Skipped e2e tests are in the published list (D-1, NFR-18)
        if: ${{ !cancelled() && hashFiles('e2e-junit.xml') != '' }}
        run: uv run python tools/ci/check_skips.py --platform "${{ matrix.platform }}" e2e-junit.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with: {name: "e2e-screenshots-${{ matrix.platform }}-${{ matrix.browser }}", path: screenshots/e2e, retention-days: 7, if-no-files-found: ignore}

  release-assets:
    # ADR-13 / FL-12 / SP-3 on Linux: build the release assets (wheel, constraints.txt, overrides.txt,
    # lerobot + hibiscus wheels, install.ps1, SHA256SUMS), check them, install them with the real
    # install.ps1 in a PowerShell container with no git into an empty home, compare the installed
    # libraries with uv.lock and smoke-launch --mock. Same script as a local dry run.
    name: release assets (build, verify, install.ps1 dry run without git)
    runs-on: ubuntu-24.04
    needs: [web]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space (torch / LeRobot wheels, twice)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/download-artifact@v6
        with: {name: web-dist, path: web/dist}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: tools/release/dry_run.sh
        run: tools/release/dry_run.sh --out "$RUNNER_TEMP/release" --port 18210
      - uses: actions/upload-artifact@v5
        with: {name: release-assets, path: "${{ runner.temp }}/release", retention-days: 7}

  windows-install:
    # P-1 / AT-1 [Vendor] approximated on windows-latest: Windows PowerShell 5.1 runs install.ps1
    # with git removed from PATH (uv downloaded and checked by the script itself), then the
    # installed libraries are compared with uv.lock and Station is smoke-launched. A clean Windows 11
    # VM without git (SP-3) stays a QC step: the runner image has Python, git and VC++ preinstalled.
    name: windows (install.ps1 without git, libraries == uv.lock, --mock smoke)
    runs-on: windows-latest
    needs: [release-assets]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v6
        with: {name: release-assets, path: release}
      - name: install.ps1 (Windows PowerShell 5.1, no git on PATH)
        shell: powershell
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'git.exe')) }) -join ';'
          if (Get-Command git -ErrorAction SilentlyContinue) { Write-Error "git is still on PATH"; exit 1 }
          $env:HIBISCUS_STATION_BASE_URL = (Resolve-Path release).Path
          # In a child PowerShell 5.1 so that everything the user would see (uv's stderr too) is
          # captured: no uv warning telling the user to fix PATH by hand (QD-17).
          $script = (Resolve-Path release\install.ps1).Path
          $out = Join-Path $env:RUNNER_TEMP "install.out"
          $err = Join-Path $env:RUNNER_TEMP "install.err"
          $p = Start-Process powershell -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err `
            -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command', "Get-Content -Raw '$script' | Invoke-Expression"
          Get-Content $out, $err
          if ($p.ExitCode -ne 0) { Write-Error "install.ps1 failed (exit $($p.ExitCode))"; exit 1 }
          $shown = (Get-Content -Raw $out) + (Get-Content -Raw $err)
          if ($shown -match 'not on your PATH|update-shell') { Write-Error "QD-17: the installer shows uv's PATH warning"; exit 1 }
          if ($shown -notmatch 'is now on your PATH') { Write-Error "QD-17: no PATH line from the installer"; exit 1 }
          # where the script's own uv put the tool (read by the next steps)
          $uv = Join-Path $env:LOCALAPPDATA "HibiscusStation\uv-$env:UV_VERSION\uv.exe"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "STATION_TOOL_DIR=$(& $uv --no-config --color never tool dir)`n")
          [IO.File]::AppendAllText($env:GITHUB_ENV, "STATION_TOOL_BIN=$(& $uv --no-config --color never tool dir --bin)`n")
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Installed libraries == uv.lock (AT-1 step 3)
        shell: pwsh
        run: |
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:RUNNER_TEMP "ref-venv"
          uv sync --locked --no-dev --no-install-project --python "$env:PYTHON_VERSION" -q
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $ref = Join-Path $env:UV_PROJECT_ENVIRONMENT "Scripts\python.exe"
          $tool = Join-Path $env:STATION_TOOL_DIR "hibiscus-station\Scripts\python.exe"
          $version = (Select-String -Path hibiscus_station\__init__.py -Pattern '^__version__ = "(.+)"$').Matches[0].Groups[1].Value
          & $ref tools\release\compare_envs.py $tool $ref $version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Serve the UI in mock mode (health, index, JS MIME type, login link)
        shell: pwsh
        run: |
          $env:PATH = "$env:STATION_TOOL_BIN;$env:PATH"
          hibiscus-station --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (hibiscus-station --help | Out-String).Contains("COM3")) { Write-Error "--help: no COM ports"; exit 1 }
          $home_ = Join-Path $env:RUNNER_TEMP "station"
          $out = Join-Path $env:RUNNER_TEMP "station-out.log"
          $err = Join-Path $env:RUNNER_TEMP "station-err.log"
          $proc = Start-Process -FilePath (Get-Command hibiscus-station).Source -PassThru -NoNewWindow `
            -ArgumentList "--mock", "--no-browser", "--port", "18210", "--home", $home_ `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $ok = $false
          foreach ($i in 1..90) {
            hibiscus-station health --home "$home_"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Get-Content $out, $err -ErrorAction SilentlyContinue; exit 1 }
          $index = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18210/
          if ($index.Content -notmatch "<title>Hibiscus Station</title>") { Write-Error "no UI index"; exit 1 }
          $js = [regex]::Match($index.Content, 'src="(/assets/[^"]+\.js)"').Groups[1].Value
          $asset = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18210$js"
          Write-Output "$js -> $($asset.Headers['Content-Type'])"
          if ("$($asset.Headers['Content-Type'])" -notmatch "javascript") { Write-Error "bad JS MIME type"; exit 1 }
          hibiscus-station url --home "$home_" | Select-String "auth\?t="
          Stop-Process -Id $proc.Id -Force
          Get-Content $out, $err -ErrorAction SilentlyContinue

  macos-install:
    # macOS is a preview platform (decision 2 = A): the same assets, installed by the bash path of
    # the dry run (git hidden), libraries == uv.lock, --mock smoke.
    name: macos (preview; release assets install, libraries == uv.lock, --mock smoke)
    runs-on: macos-latest
    needs: [release-assets]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v6
        with: {name: release-assets, path: release}
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: tools/release/dry_run.sh --no-docker --assets release --port 18210

  deploy-lint:
    name: deploy (shellcheck, hadolint, compose, actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck
        run: |
          make shellcheck
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.11.0 -x -S style tools/release/dry_run.sh
      - name: hadolint
        run: |
          for f in docker/Dockerfile docker/Dockerfile.jetson; do
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --ignore DL3008 --ignore DL3013 - < "$f"
          done
      - name: Compose files render
        working-directory: deploy
        run: |
          cp .env.example .env
          docker compose config -q
          COMPOSE_FILE=compose.yml:compose.cuda.yml docker compose config -q
          COMPOSE_FILE=compose.yml:compose.jetson.yml docker compose config -q
      - name: install.sh dry run
        run: bash deploy/install.sh --dry-run --yes --variant cpu --no-udev --no-start
      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color

  image:
    name: image (cpu, linux/amd64, smoke test)
    runs-on: ubuntu-24.04
    needs: [deploy-lint]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: docker/build.sh cpu --platform linux/amd64 --tag hibiscus-station:ci
      - name: Run with --mock until healthy
        run: |
          mkdir -p "$RUNNER_TEMP/data" "$RUNNER_TEMP/cal"
          docker run -d --name station --network host --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/data:/data" -v "$RUNNER_TEMP/cal:/calibration" hibiscus-station:ci --no-browser --mock
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' station)" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' station)" = true ] || break
            sleep 3
          done
          if ! docker inspect -f '{{.State.Health.Status}}' station | grep -qx healthy; then
            # QD-8: say why (the container's own output and its health-check answers)
            docker inspect -f 'state={{.State.Status}} exit={{.State.ExitCode}} health={{json .State.Health}}' station
            docker logs station 2>&1 | tail -80
            echo "::error::the --mock container never became healthy"; exit 1
          fi
          curl -fsS http://127.0.0.1:18210/ | grep -q "<title>Hibiscus Station</title>"
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hibiscus-station:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          scanners: vuln,secret
