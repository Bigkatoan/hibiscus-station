# Dependabot: weekly grouped updates.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    ignore:
      # Pinned on purpose: LeRobot by commit, the torch stack per image variant (docker/build.sh),
      # and the Hibiscus CLI to the server API version it talks to (tests/contract/).
      - dependency-name: lerobot
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: torchcodec
      - dependency-name: hibiscus
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly, day: monday}
    labels: ["dependencies", "docker"]

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
