openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Hibiscus API
  version: 0.1.0
  summary: Self-hosted training platform for LeRobot policies.
  description: |
    Contract v0.1 (FROZEN). Source of truth for backend (FastAPI), frontend (generated TS client)
    and the `hibiscus` CLI (generated Python client). Owner: A1 (Solution Architect).

    ## Conventions
    * Base path `/api/v1`. JSON bodies are `application/json; charset=utf-8`, field names snake_case.
    * IDs are UUIDs (string, format uuid). Timestamps are RFC 3339 UTC (`2026-11-15T09:30:00Z`).
    * Errors are RFC 9457 `application/problem+json` (`Problem`) with a stable machine `code`
      (catalog: `ErrorCode`). Clients branch on `code`, never on `title`/`detail` (those are English,
      UI localises from `code`).
    * List endpoints use cursor pagination: `?limit=` (1..200, default 50) and `?cursor=` (opaque,
      from `next_cursor` of the previous page). Order is documented per endpoint and stable.
    * Workspace scoping: list/create endpoints take `workspace_id`. Item endpoints are addressed by
      globally unique id; access to an item in a workspace the caller is not a member of returns
      **404 `not_found`** (no existence oracle); so does a list/create request naming a workspace the
      caller is not a member of (CR-BE-P5-1). A PAT is bound to one workspace: list/create requests
      that name another workspace get 403 `forbidden`.
    * Authentication: browser = cookie session (`hb_access` JWT 15 min + rotating `hb_refresh`)
      and CSRF double-submit (`hb_csrf` cookie echoed in `X-CSRF-Token`) on every unsafe method;
      machines = `Authorization: Bearer hbp_...` PAT with scopes. Bearer requests skip CSRF.
    * Every response carries `X-Request-Id` (echoes a valid inbound `X-Request-Id`, else generated).
    * `Idempotency-Key` (≤ 64 chars) is honoured on `POST /runs` and `POST /uploads` for 24 h:
      replay returns the original status/body.
    * Rate limits: 429 `rate_limited` with `Retry-After` (seconds).
    * Bodies are limited to 1 MiB except `PUT /uploads/{upload_id}/parts/{part_number}` (64 MiB);
      Cloudflare rejects anything above 100 MB (ADR-10).
    * Server-Sent Events: `text/event-stream`, `event: heartbeat` every 15 s, `id:` only on persisted
      events (resume with `Last-Event-ID`). See `RunStreamEvent`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://hibiscus.example.com/api/v1
    description: Production (Cloudflare Tunnel -> 127.0.0.1:18000 reverse proxy)
  - url: http://127.0.0.1:18000/api/v1
    description: Local origin on the GPU box (reverse proxy, plain HTTP, loopback only)
  - url: http://localhost:8080/api/v1
    description: Developer stack (docker compose dev profile)
security:
  - cookieAuth: []
tags:
  - name: auth
    description: Login, sessions, 2FA, password, invites, PATs (owner A2)
  - name: users
    description: Current user profile and secrets (owner A2)
  - name: workspaces
    description: Workspaces, members, invites, quotas (owner A2)
  - name: datasets
    description: Datasets, versions, validation, preview (owner A3)
  - name: uploads
    description: Chunked resumable uploads through the API (owner A3)
  - name: policies
    description: Policy catalogue, JSON Schemas, presets (owner A4)
  - name: runs
    description: Training runs, lifecycle, metrics, logs, SSE (owner A4)
  - name: models
    description: Exported bundles, download, Hub push (owner A5 worker / A4 API)
  - name: jobs
    description: Background jobs (validate, export, eval, import)
  - name: gpus
    description: GPU nodes and queue (owner A4)
  - name: notifications
    description: In-app notifications and channels
  - name: admin
    description: Platform administration (platform admins only)
  - name: ops
    description: Health and metrics (not routed publicly except healthz)
paths:
  # =============================================================================================
  # AUTH
  # =============================================================================================
  /auth/invites/preview:
    post:
      tags: [auth]
      operationId: previewInvite
      summary: Inspect an invite link before registering / accepting (token in the body)
      description: |
        The invite token is sent in the body so it never appears in a URL path (access logs,
        CR-BE-S1). Same answer as the deprecated `GET /auth/invites/{token}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: Invite is valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitePreview'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/invites/accept:
    post:
      tags: [auth]
      operationId: acceptInviteToken
      summary: Accept an invite with the currently logged-in account (token in the body)
      description: Same as the deprecated `POST /auth/invites/{token}/accept` (CR-BE-S1).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: Membership created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /auth/invites/{token}:
    get:
      tags: [auth]
      operationId: getInvitePreview
      summary: Inspect an invite link before registering / accepting
      description: Deprecated (CR-BE-S1) - use `POST /auth/invites/preview`; the token in the path is redacted from access logs.
      deprecated: true
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, minLength: 32, maxLength: 128}
      responses:
        '200':
          description: Invite is valid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitePreview'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/register-invite:
    post:
      tags: [auth]
      operationId: registerWithInvite
      summary: Create an account from an invite (email is pre-verified by the invite)
      description: |
        Only path to create an account (no open sign-up). If the invite email already has an
        account, use `POST /auth/invites/accept` while logged in instead (409 `email_taken`).
        On success the session cookies are set exactly like a successful login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInviteRequest'}
      responses:
        '201':
          description: Account created and logged in
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookies'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/invites/{token}/accept:
    post:
      tags: [auth]
      operationId: acceptInvite
      summary: Accept an invite with the currently logged-in account
      description: Deprecated (CR-BE-S1) - use `POST /auth/invites/accept`; the token in the path is redacted from access logs.
      deprecated: true
      parameters:
        - name: token
          in: path
          required: true
          schema: {type: string, minLength: 32, maxLength: 128}
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Membership created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Password login (step 1)
      description: |
        Returns `status=ok` (cookies set) or `status=mfa_required` with a 5-minute `mfa_token`
        to be completed via `POST /auth/login/2fa`. Users whose role requires 2FA but who have not
        enrolled get `status=ok` with `mfa_enrollment_required=true`: the session can only call
        `/auth/me`, `/auth/2fa/*`, `/auth/logout` until enrolment (others return 403
        `mfa_enrollment_required`). 5 consecutive failures lock the account with exponential
        backoff; while locked, login answers the same 401 `invalid_credentials` as for a wrong
        password or an unknown email, so a lock does not reveal that an account exists (CR-BE-S1;
        423 is no longer returned here). `turnstile_token` is required when the server reports
        `turnstile_required` (always in production).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Logged in, or second factor required
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookies'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/login/2fa:
    post:
      tags: [auth]
      operationId: loginSecondFactor
      summary: Complete login with a TOTP code or a recovery code (step 2)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginSecondFactorRequest'}
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookies'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        Reads `hb_refresh` (cookie, path `/api/v1/auth`). Requires `X-CSRF-Token`. Presenting an
        already-rotated refresh token revokes the whole session family (401
        `refresh_reuse_detected`), with two exceptions (CR-BE-S1): (a) its successor has never been
        used (no request carried an access token issued with it, e.g. the rotation response was
        aborted by a page reload) - the token is rotated again and new cookies are set; (b) within
        10 s of the rotation (concurrent tab) - 204 without cookies. The SPA calls this when any
        request returns 401 `token_expired`, then retries once.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Rotated
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookies'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session and clear cookies
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Logged out (idempotent)
          headers:
            Set-Cookie: {$ref: '#/components/headers/ClearSessionCookies'}
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current principal (user, memberships, MFA state; PAT info when bearer)
      description: Also (re)issues the `hb_csrf` cookie when missing.
      security:
        - cookieAuth: []
        - patAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      summary: Public auth configuration for the login page
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthConfig'}
  /auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address with the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '204': {description: Verified}
        '400': {$ref: '#/components/responses/BadRequest'}
  /auth/email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: Re-send the verification email for the current user
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202': {description: Queued (also when already verified)}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password-reset email
      description: Always 202 (no account enumeration). Token valid 30 minutes, single use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForgotPasswordRequest'}
      responses:
        '202': {description: Accepted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a reset token (revokes all sessions and clears lockout)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: Password changed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/password/change:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change password (revokes all other sessions)
      description: |
        Password / TOTP checks by a logged-in session are rate limited per user (10 per 15 min, 429)
        and count towards the account lockout like failed logins (423 `account_locked` while
        locked; CR-BE-S1).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {description: Changed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /auth/2fa/totp/setup:
    post:
      tags: [auth]
      operationId: setupTotp
      summary: Start TOTP enrolment (returns secret + otpauth URI; not active until enabled)
      description: |
        Password / TOTP checks by a logged-in session are rate limited per user (10 per 15 min, 429)
        and count towards the account lockout like failed logins (423 `account_locked` while
        locked; CR-BE-S1).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordConfirmRequest'}
      responses:
        '200':
          description: Pending secret
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TotpSetup'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '409': {$ref: '#/components/responses/Conflict'}
  /auth/2fa/totp/enable:
    post:
      tags: [auth]
      operationId: enableTotp
      summary: Confirm enrolment with a first code; returns 10 recovery codes (shown once)
      description: |
        Enabling 2FA revokes every other session of the user (they never passed 2FA) and every
        personal access token of the user (they were minted without 2FA; `api_tokens_revoked` gives
        the count); the calling session becomes 2FA-verified. Rate limit / lockout as for `changePassword` (CR-BE-S1).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TotpCodeRequest'}
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodes'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '409': {$ref: '#/components/responses/Conflict'}
  /auth/2fa/totp/disable:
    post:
      tags: [auth]
      operationId: disableTotp
      summary: Disable TOTP (409 `mfa_required_by_role` for owner/admin/platform admin)
      description: |
        Password / TOTP checks by a logged-in session are rate limited per user (10 per 15 min, 429)
        and count towards the account lockout like failed logins (423 `account_locked` while
        locked; CR-BE-S1).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TotpDisableRequest'}
      responses:
        '204': {description: Disabled}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '409': {$ref: '#/components/responses/Conflict'}
  /auth/2fa/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      summary: Replace all recovery codes (old ones become invalid)
      description: |
        Password / TOTP checks by a logged-in session are rate limited per user (10 per 15 min, 429)
        and count towards the account lockout like failed logins (423 `account_locked` while
        locked; CR-BE-S1).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TotpCodeRequest'}
      responses:
        '200':
          description: New codes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryCodes'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: Active sessions of the current user (one entry per session family)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SessionInfo'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /auth/sessions/{session_id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      summary: Revoke one session family
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: session_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /auth/sessions/revoke-others:
    post:
      tags: [auth]
      operationId: revokeOtherSessions
      summary: Revoke every session except the current one
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /auth/tokens:
    get:
      tags: [auth]
      operationId: listApiTokens
      summary: Personal access tokens of the current user (never includes secrets)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ApiToken'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [auth]
      operationId: createApiToken
      summary: Create a PAT bound to one workspace; plaintext returned ONCE
      description: >-
        Requires a session with a verified second factor if the user has 2FA enabled, and always
        for a token bound to a workspace where the user is owner or admin. A PAT acts with owner or
        admin power only while the user has 2FA enabled and only if it was minted from a
        2FA-verified session; otherwise it acts as a member.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiTokenCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiTokenCreated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /auth/tokens/{token_id}:
    delete:
      tags: [auth]
      operationId: revokeApiToken
      summary: Revoke a PAT (idempotent)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: token_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  # =============================================================================================
  # USERS
  # =============================================================================================
  /users/me:
    patch:
      tags: [users]
      operationId: updateMe
      summary: Update display name / locale
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserUpdate'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /users/me/secrets/hf-token:
    get:
      tags: [users]
      operationId: getHfTokenStatus
      summary: Whether a Hugging Face token is stored (never returns the token)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    put:
      tags: [users]
      operationId: setHfToken
      summary: Store (encrypted) a Hugging Face token used for imports and Hub pushes
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: {type: string, minLength: 8, maxLength: 256, writeOnly: true}
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecretStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [users]
      operationId: deleteHfToken
      summary: Remove the stored Hugging Face token
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /users/me/notification-channels:
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      summary: External notification channels (email / Discord / Telegram / webhook)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/NotificationChannel'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      summary: Add a channel
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationChannelCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationChannel'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /users/me/notification-channels/{channel_id}:
    delete:
      tags: [notifications]
      operationId: deleteNotificationChannel
      summary: Remove a channel
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: channel_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/me/notification-channels/{channel_id}/test:
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      summary: Send a test message
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: channel_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '202': {description: Sent}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: In-app notifications, newest first
      parameters:
        - name: unread
          in: query
          schema: {type: boolean}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /notifications/{notification_id}/read:
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one notification read
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: notification_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: OK}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications read
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: OK}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  # =============================================================================================
  # WORKSPACES
  # =============================================================================================
  /workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: Workspaces the caller is a member of (PAT => only its workspace), by name
      security:
        - cookieAuth: []
        - patAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace (platform admins only in v1); creator becomes owner
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /workspaces/{workspace_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: Workspace detail incl. caller role
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: Rename / change settings (owner, admin)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceUpdate'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: Soft-delete (owner only; 409 `workspace_not_empty` while runs are active)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspace_id}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
    get:
      tags: [workspaces]
      operationId: listMembers
      summary: Members, by display name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      - name: user_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [workspaces]
      operationId: updateMemberRole
      summary: Change a member's role
      description: |
        owner can set any role; admin can set member/viewer for non-owners. Demoting the last
        owner => 409 `last_owner`. Promoting to owner/admin requires the target to have 2FA
        enabled (409 `mfa_required_by_role`).
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: {$ref: '#/components/schemas/WorkspaceRole'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [workspaces]
      operationId: removeMember
      summary: Remove a member (or leave, when user_id is self); revokes their PATs for this workspace
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspace_id}/invites:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
    get:
      tags: [workspaces]
      operationId: listInvites
      summary: Pending invites (owner, admin), newest first
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Invite'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [workspaces]
      operationId: createInvite
      summary: Invite by email (72 h, single use). Returns `accept_url` only when email delivery is disabled.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InviteCreated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /workspaces/{workspace_id}/invites/{invite_id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      - name: invite_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [workspaces]
      operationId: revokeInvite
      summary: Revoke a pending invite
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspace_id}/invites/{invite_id}/resend:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
      - name: invite_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [workspaces]
      operationId: resendInvite
      summary: Re-issue the token (new 72 h window, old link invalid) and re-send
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Re-sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InviteCreated'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspace_id}/usage:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
    get:
      tags: [workspaces]
      operationId: getWorkspaceUsage
      summary: Effective quotas and current usage (workspace and caller)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceUsage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspace_id}/events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
    get:
      tags: [workspaces]
      operationId: streamWorkspaceEvents
      summary: SSE stream of workspace-level changes (run status, dataset status, model ready, notifications)
      description: |
        Ephemeral stream (no replay); `event:` is one of `WorkspaceStreamEvent.event`. Heartbeat every 15 s.
        The session and workspace membership are re-checked every 15 s: the stream ends when the
        session is revoked / logged out or the membership ends, and after at most 15 min in any
        case (the client reconnects with fresh credentials; CR-BE-S1).
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/WorkspaceStreamEvent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  # =============================================================================================
  # DATASETS
  # =============================================================================================
  /datasets:
    get:
      tags: [datasets]
      operationId: listDatasets
      summary: Datasets in a workspace, most recently updated first
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - name: q
          in: query
          description: Case-insensitive substring of name
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [datasets]
      operationId: createDataset
      summary: Create an empty dataset (versions are added by uploads / imports / merges)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatasetCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dataset'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /datasets/import-hf:
    post:
      tags: [datasets]
      operationId: importHfDataset
      summary: Import a LeRobot dataset from the Hugging Face Hub as a new version
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HfImportRequest'}
      responses:
        '202':
          description: Import job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetVersionAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /datasets/merge:
    post:
      tags: [datasets]
      operationId: mergeDatasets
      summary: Merge ready versions with identical feature schema into a new version (lerobot-edit-dataset)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MergeRequest'}
      responses:
        '202':
          description: Merge job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetVersionAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /datasets/{dataset_id}:
    parameters:
      - $ref: '#/components/parameters/DatasetIdPath'
    get:
      tags: [datasets]
      operationId: getDataset
      summary: Dataset with its latest version summary
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dataset'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [datasets]
      operationId: updateDataset
      summary: Rename / edit description (member+)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DatasetUpdate'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dataset'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [datasets]
      operationId: deleteDataset
      summary: Soft-delete dataset and all versions (409 `dataset_in_use` if a non-terminal run uses it)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /datasets/{dataset_id}/versions:
    parameters:
      - $ref: '#/components/parameters/DatasetIdPath'
    get:
      tags: [datasets]
      operationId: listDatasetVersions
      summary: Versions, highest version number first
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetVersionPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /dataset-versions/{version_id}:
    parameters:
      - $ref: '#/components/parameters/VersionIdPath'
    get:
      tags: [datasets]
      operationId: getDatasetVersion
      summary: One version (schema, stats summary, status, validation summary)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetVersion'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [datasets]
      operationId: deleteDatasetVersion
      summary: Soft-delete a version (409 `dataset_in_use` while referenced by a non-terminal run)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /dataset-versions/{version_id}/validation:
    parameters:
      - $ref: '#/components/parameters/VersionIdPath'
    get:
      tags: [datasets]
      operationId: getValidationReport
      summary: Full step-by-step validation report (404 until validation started)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationReport'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [datasets]
      operationId: revalidateDatasetVersion
      summary: Re-run validation (allowed when status is invalid / failed / ready)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Validation job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /dataset-versions/{version_id}/preview:
    parameters:
      - $ref: '#/components/parameters/VersionIdPath'
    get:
      tags: [datasets]
      operationId: getDatasetPreview
      summary: Episode list, thumbnails, length distribution (available when status=ready or invalid)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DatasetPreview'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /dataset-versions/{version_id}/episodes/{episode_index}:
    parameters:
      - $ref: '#/components/parameters/VersionIdPath'
      - name: episode_index
        in: path
        required: true
        schema: {type: integer, minimum: 0}
    get:
      tags: [datasets]
      operationId: getEpisode
      summary: One episode - per-joint time series (downsampled) and video locations
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      parameters:
        - name: max_points
          in: query
          schema: {type: integer, minimum: 50, maximum: 5000, default: 1000}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpisodeDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /dataset-versions/{version_id}/media/{path}:
    parameters:
      - $ref: '#/components/parameters/VersionIdPath'
      - name: path
        in: path
        required: true
        description: |
          Relative path inside the dataset, URL-encoded, restricted to `videos/**.mp4`,
          `meta/**` and `previews/**` (generated thumbnails, `previews/<camera_key>/<episode>.jpg`).
        schema: {type: string, maxLength: 512}
    get:
      tags: [datasets]
      operationId: getDatasetMedia
      summary: Stream a media/meta file (HTTP Range supported, immutable caching)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      parameters:
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: Whole file
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Accept-Ranges: {$ref: '#/components/headers/AcceptRanges'}
          content:
            video/mp4:
              schema: {type: string, contentMediaType: video/mp4}
            image/jpeg:
              schema: {type: string, contentMediaType: image/jpeg}
            application/json:
              schema: {}
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '206':
          description: Partial content
          headers:
            Content-Range: {$ref: '#/components/headers/ContentRange'}
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
  /dataset-versions/{version_id}/archive:
    parameters:
      - $ref: '#/components/parameters/VersionIdPath'
    get:
      tags: [datasets]
      operationId: downloadDatasetVersion
      summary: Download the version as an uncompressed tar stream (`<slug>-v<version>.tar`)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      responses:
        '200':
          description: Tar stream
          headers:
            Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
          content:
            application/x-tar:
              schema: {type: string, contentMediaType: application/x-tar}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # =============================================================================================
  # UPLOADS (ADR-4 + ADR-10): init -> PUT parts (<= 64 MiB, sha256 each) -> complete | abort
  # =============================================================================================
  /uploads:
    get:
      tags: [uploads]
      operationId: listUploads
      summary: Upload sessions of the caller in a workspace (newest first); used by the CLI to resume
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/UploadStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [uploads]
      operationId: initUpload
      summary: Start a chunked upload of one archive
      description: |
        Server fixes `part_size` (requested value clamped to [5 MiB, 64 MiB], default 64 MiB) and
        `part_count = ceil(size / part_size)`. Checks quota (`max_upload_bytes`, `storage_bytes`)
        up front (403 `quota_exceeded`). Honors `Idempotency-Key`. If an `active` session from the
        same user with identical (`workspace_id`, `sha256`, `size`) exists it is returned with 200
        instead of 201 (natural resume).
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadInit'}
      responses:
        '200':
          description: Existing active session returned (resume)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /uploads/{upload_id}:
    parameters:
      - $ref: '#/components/parameters/UploadIdPath'
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Session state incl. received parts (resume = upload the missing part numbers)
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [uploads]
      operationId: abortUpload
      summary: Abort (S3 AbortMultipartUpload); idempotent for aborted/expired sessions
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Aborted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /uploads/{upload_id}/parts/{part_number}:
    parameters:
      - $ref: '#/components/parameters/UploadIdPath'
      - name: part_number
        in: path
        required: true
        schema: {type: integer, minimum: 1, maximum: 10000}
    put:
      tags: [uploads]
      operationId: uploadPart
      summary: Upload one part (raw bytes). Re-uploading a part replaces it.
      description: |
        Body is exactly `part_size` bytes for parts 1..N-1 and the remainder for part N
        (422 `upload_part_size_invalid` otherwise). The server streams the body to S3 UploadPart
        while hashing; if sha256 != `X-Content-SHA256` the part is discarded (422
        `upload_part_checksum_mismatch`). Each successful part slides `expires_at` to now + 7 days.
        Max body 64 MiB (fits Cloudflare's 100 MB limit). Recommended client timeout 300 s, retry
        with exponential backoff (1, 2, 4 ... 60 s) on network errors / 5xx / 429.
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: X-Content-SHA256
          in: header
          required: true
          description: Lower-case hex sha256 of the part body
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
        - name: Content-Length
          in: header
          required: true
          schema: {type: integer, minimum: 1, maximum: 67108864}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, contentMediaType: application/octet-stream}
      responses:
        '200':
          description: Part stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadPart'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '411': {$ref: '#/components/responses/LengthRequired'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /uploads/{upload_id}/complete:
    parameters:
      - $ref: '#/components/parameters/UploadIdPath'
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Finish the multipart upload and queue unpack + validation
      description: |
        Requires every part 1..part_count (409 `upload_incomplete` with `missing_parts`). Server
        calls S3 CompleteMultipartUpload, creates the `DatasetVersion` (status `pending`, creating
        the dataset first when `new_dataset_name` was given) and queues a `validate_dataset` job
        whose first step re-hashes the whole object and compares with the declared `sha256`
        (mismatch => version `failed`, code `upload_checksum_mismatch`). Idempotent: calling again
        on a completed session returns the same body.
      security:
        - cookieAuth: []
        - patAuth: ['datasets:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Completed; validation queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadCompleted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  # =============================================================================================
  # POLICIES
  # =============================================================================================
  /policies:
    get:
      tags: [policies]
      operationId: listPolicies
      summary: Policy catalogue with support matrix (served from api/policy-schemas, no LeRobot import)
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [lerobot_version, items]
                properties:
                  lerobot_version: {type: string, examples: ['0.7.1']}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/PolicySummary'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /policies/{policy_type}:
    parameters:
      - $ref: '#/components/parameters/PolicyTypePath'
    get:
      tags: [policies]
      operationId: getPolicy
      summary: JSON Schemas (policy + train) and presets for one policy
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      responses:
        '200':
          description: OK
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyDetail'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  # =============================================================================================
  # RUNS
  # =============================================================================================
  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: Runs in a workspace, newest first
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - name: status
          in: query
          description: Comma-separated filter
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/RunStatus'}
        - name: dataset_id
          in: query
          schema: {type: string, format: uuid}
        - name: policy_type
          in: query
          schema: {$ref: '#/components/schemas/PolicyType'}
        - name: created_by
          in: query
          description: User id, or `me`
          schema: {type: string, maxLength: 36}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [runs]
      operationId: createRun
      summary: Create and enqueue a run (runs the same checks as preflight; 422 `preflight_failed` on blockers)
      security:
        - cookieAuth: []
        - patAuth: ['runs:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunCreate'}
      responses:
        '201':
          description: Queued
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /runs/preflight:
    post:
      tags: [runs]
      operationId: preflightRun
      summary: Validate a RunCreate without creating it; returns checks, estimate, resolved config
      description: |
        Always 200 when the body is schema-valid; blockers are reported in `checks` with
        `severity=error`. The resource estimate may be `source=pending` while a dry-run job is
        measuring it (poll again, or listen on the workspace stream for `estimate.ready`).
      security:
        - cookieAuth: []
        - patAuth: ['runs:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunCreate'}
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreflightReport'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /runs/compare:
    get:
      tags: [runs]
      operationId: compareRuns
      summary: Overlay metric series and diff configs of 2..8 runs (same workspace)
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      parameters:
        - name: ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 2
            maxItems: 8
            items: {type: string, format: uuid}
        - name: keys
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
            default: [loss]
        - name: max_points
          in: query
          schema: {type: integer, minimum: 50, maximum: 5000, default: 1000}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunComparison'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [runs]
      operationId: getRun
      summary: Run detail
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [runs]
      operationId: updateRun
      summary: Rename; change priority / requested GPU only while queued (409 `run_invalid_transition`)
      security:
        - cookieAuth: []
        - patAuth: ['runs:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunUpdate'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /runs/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    post:
      tags: [runs]
      operationId: cancelRun
      summary: Cancel (queued/paused => cancelled immediately; active => cancelling)
      security:
        - cookieAuth: []
        - patAuth: ['runs:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Accepted (idempotent for cancelling/cancelled)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{run_id}/pause:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    post:
      tags: [runs]
      operationId: pauseRun
      summary: Pause and release the GPU (running => pausing => paused); resume continues from checkpoints/last
      description: |
        `mode=next_checkpoint` (default) keeps training until the next scheduled checkpoint
        (`save_freq`) is written and uploaded, then stops - no progress is lost.
        `mode=now` stops immediately; progress since the last checkpoint is discarded.
        See docs/spec/run-lifecycle.md §3.
      security:
        - cookieAuth: []
        - patAuth: ['runs:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunPauseRequest'}
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{run_id}/resume:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    post:
      tags: [runs]
      operationId: resumeRun
      summary: Re-queue a paused run, or a failed run that has a checkpoint, resuming from checkpoints/last
      security:
        - cookieAuth: []
        - patAuth: ['runs:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunResumeRequest'}
      responses:
        '202':
          description: Re-queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{run_id}/clone:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    post:
      tags: [runs]
      operationId: cloneRun
      summary: Create a new run from this run's config, deep-merging the given overrides
      security:
        - cookieAuth: []
        - patAuth: ['runs:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunCloneRequest'}
      responses:
        '201':
          description: Queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /runs/{run_id}/metrics:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [runs]
      operationId: getRunMetrics
      summary: Metric series by step (LTTB-downsampled to max_points per key)
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      parameters:
        - name: keys
          in: query
          description: Comma-separated metric keys; default = all keys present
          style: form
          explode: false
          schema:
            type: array
            items: {type: string, pattern: '^[a-z][a-z0-9_]{0,63}$'}
        - name: from_step
          in: query
          schema: {type: integer, minimum: 0}
        - name: to_step
          in: query
          schema: {type: integer, minimum: 0}
        - name: max_points
          in: query
          schema: {type: integer, minimum: 50, maximum: 10000, default: 2000}
        - name: format
          in: query
          schema: {type: string, enum: [json, csv], default: json}
      responses:
        '200':
          description: Series
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricSeriesSet'}
            text/csv:
              schema: {type: string, description: 'Header `step,key,value,ts`; never downsampled'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/telemetry:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [runs]
      operationId: getRunTelemetry
      summary: GPU telemetry samples recorded while this run held a GPU
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      parameters:
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - name: max_points
          in: query
          schema: {type: integer, minimum: 50, maximum: 10000, default: 2000}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/GpuSample'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/logs:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [runs]
      operationId: getRunLogs
      summary: Raw log (all attempts concatenated, tqdm `\r` frames collapsed to the last frame)
      description: |
        Byte-addressed: supports `Range: bytes=<from>-` for tailing; `?download=true` adds
        `Content-Disposition: attachment; filename=run-<number>.log`. Live tail via SSE `log` events.
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      parameters:
        - $ref: '#/components/parameters/RangeHeader'
        - name: download
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Whole log
          headers:
            Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
          content:
            text/plain:
              schema: {type: string}
        '206':
          description: Partial
          headers:
            Content-Range: {$ref: '#/components/headers/ContentRange'}
          content:
            text/plain:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
  /runs/{run_id}/logs/search:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [runs]
      operationId: searchRunLogs
      summary: Case-insensitive substring search over log lines
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 200}
        - name: level
          in: query
          schema: {type: string, enum: [debug, info, warning, error]}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Matches in file order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LogSearchPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [runs]
      operationId: streamRunEvents
      summary: Live run stream (SSE). See RunStreamEvent for framing.
      description: |
        Framing (one SSE message per event):
        ```
        id: 42            # only for persisted events (= run_events.seq)
        event: metrics    # RunStreamEvent.event
        data: {...}       # JSON, schema by event name (RunStreamEvent oneOf)
        ```
        * `retry: 3000` is sent first. `event: heartbeat` every 15 s (Cloudflare idles at ~100 s).
        * The caller's session / PAT and workspace membership are re-checked every 15 s; the stream
          ends (no `end` event) when either is gone, and after at most 15 min in any case - the
          client reconnects with `Last-Event-ID` (CR-BE-S1).
        * With `Last-Event-ID: <seq>` (or `?after_seq=`) the server first replays persisted events
          with seq > N (status, metrics, checkpoint, warning, error, model), then goes live.
        * Ephemeral events (`progress`, `log`, `telemetry`) carry no `id`.
        * The stream ends with `event: end` after the run reaches a terminal status and the
          backlog is flushed.
        * Response headers: `Cache-Control: no-cache`, `X-Accel-Buffering: no`.
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, pattern: '^[0-9]{1,18}$'}
        - name: after_seq
          in: query
          schema: {type: integer, minimum: 0}
        - name: include
          in: query
          description: Ephemeral event types to include (default all)
          style: form
          explode: false
          schema:
            type: array
            items: {type: string, enum: [progress, log, telemetry]}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {$ref: '#/components/schemas/RunStreamEvent'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/events/history:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [runs]
      operationId: listRunEvents
      summary: Persisted run events as JSON (same payloads as SSE), ascending seq
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      parameters:
        - name: after_seq
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: types
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/RunEventType'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, last_seq]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/RunEventRecord'}
                  last_seq: {type: integer}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/manifest:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [runs]
      operationId: getRunManifest
      summary: Reproducibility manifest (versions, image digest, dataset hash, resolved config, seed, split)
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunManifest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/checkpoints:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
    get:
      tags: [runs]
      operationId: listCheckpoints
      summary: Checkpoints of the run, ascending step
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Checkpoint'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/checkpoints/{step}/export:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
      - $ref: '#/components/parameters/StepPath'
    post:
      tags: [runs]
      operationId: exportCheckpoint
      summary: Build a model bundle from a specific checkpoint (the final one is exported automatically)
      description: >-
        GPU job: refused with 403 `quota_exceeded` when the requester's monthly GPU hours are used up
        (`params.reason=gpu_hours`) or when `max_concurrent_runs` export/eval jobs of the requester are
        already queued or running (`params.reason=concurrent_jobs`). The job's GPU time counts
        toward the monthly GPU hours.
      security:
        - cookieAuth: []
        - patAuth: ['runs:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportOptions'}
      responses:
        '202':
          description: Export queued (or existing model returned with 200)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Model'}
        '200':
          description: Model for this checkpoint already exists
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Model'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{run_id}/checkpoints/{step}/eval:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
      - $ref: '#/components/parameters/StepPath'
    post:
      tags: [runs]
      operationId: evalCheckpoint
      summary: Run offline held-out evaluation for a checkpoint
      description: >-
        GPU job: refused with 403 `quota_exceeded` when the requester's monthly GPU hours are used up
        (`params.reason=gpu_hours`) or when `max_concurrent_runs` export/eval jobs of the requester are
        already queued or running (`params.reason=concurrent_jobs`). The job's GPU time counts
        toward the monthly GPU hours.
      security:
        - cookieAuth: []
        - patAuth: ['runs:write']
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Eval job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{run_id}/checkpoints/{step}/eval-result:
    parameters:
      - $ref: '#/components/parameters/RunIdPath'
      - $ref: '#/components/parameters/StepPath'
    get:
      tags: [runs]
      operationId: getCheckpointEval
      summary: Offline eval result (404 until an eval succeeded)
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvalMetrics'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  # =============================================================================================
  # MODELS
  # =============================================================================================
  /models:
    get:
      tags: [models]
      operationId: listModels
      summary: Models (bundles) in a workspace, newest first
      security:
        - cookieAuth: []
        - patAuth: ['models:read']
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - name: run_id
          in: query
          schema: {type: string, format: uuid}
        - name: policy_type
          in: query
          schema: {$ref: '#/components/schemas/PolicyType'}
        - name: verified
          in: query
          schema: {type: boolean}
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /models/{model_id}:
    parameters:
      - $ref: '#/components/parameters/ModelIdPath'
    get:
      tags: [models]
      operationId: getModel
      summary: Model detail incl. verification and ONNX status
      security:
        - cookieAuth: []
        - patAuth: ['models:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Model'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [models]
      operationId: updateModel
      summary: Rename (bundle name inside the archive is unchanged)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: {$ref: '#/components/schemas/ResourceName'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Model'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [models]
      operationId: deleteModel
      summary: Soft-delete (bundle object removed after 7 days)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Deleted}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /models/{model_id}/download:
    parameters:
      - $ref: '#/components/parameters/ModelIdPath'
    get:
      tags: [models]
      operationId: downloadModel
      summary: Download the bundle zip (Range supported for resume; ETag = bundle sha256)
      description: Audited (`model.download`). 409 `model_not_ready` unless status=ready.
      security:
        - cookieAuth: []
        - patAuth: ['models:read']
      parameters:
        - $ref: '#/components/parameters/RangeHeader'
        - name: If-Range
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Zip
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Content-Disposition: {$ref: '#/components/headers/ContentDisposition'}
            Accept-Ranges: {$ref: '#/components/headers/AcceptRanges'}
          content:
            application/zip:
              schema: {type: string, contentMediaType: application/zip}
        '206':
          description: Partial
          headers:
            Content-Range: {$ref: '#/components/headers/ContentRange'}
          content:
            application/zip:
              schema: {type: string, contentMediaType: application/zip}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
  /models/{model_id}/files:
    parameters:
      - $ref: '#/components/parameters/ModelIdPath'
    get:
      tags: [models]
      operationId: listModelFiles
      summary: Bundle file list from MANIFEST.json (lets `hibiscus pull --only pretrained_model` fetch per file)
      security:
        - cookieAuth: []
        - patAuth: ['models:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BundleManifest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /models/{model_id}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/ModelIdPath'
      - name: path
        in: path
        required: true
        description: Path relative to the bundle root, URL-encoded, must be listed in MANIFEST.json
        schema: {type: string, maxLength: 512}
    get:
      tags: [models]
      operationId: getModelFile
      summary: Download one bundle file (Range supported)
      security:
        - cookieAuth: []
        - patAuth: ['models:read']
      parameters:
        - $ref: '#/components/parameters/RangeHeader'
      responses:
        '200':
          description: File
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '206':
          description: Partial
          headers:
            Content-Range: {$ref: '#/components/headers/ContentRange'}
          content:
            application/octet-stream:
              schema: {type: string, contentMediaType: application/octet-stream}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416': {$ref: '#/components/responses/RangeNotSatisfiable'}
  /models/{model_id}/push-hub:
    parameters:
      - $ref: '#/components/parameters/ModelIdPath'
    post:
      tags: [models]
      operationId: pushModelToHub
      summary: Push pretrained_model/ (+ MODEL_CARD.md as README.md) to the HF Hub using the caller's stored token
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HubPushRequest'}
      responses:
        '202':
          description: Push job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '501': {$ref: '#/components/responses/FeatureDisabled'}
  /models/{model_id}/verify:
    parameters:
      - $ref: '#/components/parameters/ModelIdPath'
    post:
      tags: [models]
      operationId: reverifyModel
      summary: Re-run the 3 verification checks (load, ONNX parity, manifest hashes)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  # =============================================================================================
  # JOBS / GPUS / QUEUE
  # =============================================================================================
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Background jobs in a workspace, newest first
      security:
        - cookieAuth: []
        - patAuth: ['datasets:read']
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdQuery'
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/JobKind'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/JobStatus'}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [jobs]
      operationId: getJob
      summary: Job status / progress / result
      description: Any PAT scope of the job's domain may read it (datasets:read for dataset jobs, runs:read / models:read otherwise).
      security:
        - cookieAuth: []
        - patAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /jobs/{job_id}/cancel:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a queued or running job (idempotent)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /gpus:
    get:
      tags: [gpus]
      operationId: listGpus
      summary: GPU nodes with live state (latest telemetry sample, current run if visible to caller)
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/GpuNode'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /queue:
    get:
      tags: [gpus]
      operationId: getQueue
      summary: Global queue in scheduling order (runs of other workspaces are anonymised)
      security:
        - cookieAuth: []
        - patAuth: ['runs:read']
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/QueueEntry'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  # =============================================================================================
  # ADMIN (users.is_platform_admin = true, 2FA verified session)
  # =============================================================================================
  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: All users, by email
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 100}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [admin]
      operationId: adminUpdateUser
      summary: Enable/disable, grant/revoke platform admin, force 2FA, unlock
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUserUpdate'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUser'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/users/{user_id}/revoke-sessions:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [admin]
      operationId: adminRevokeUserSessions
      summary: Revoke all sessions and PATs of a user
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Revoked}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/users/{user_id}/password-reset-link:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [admin]
      operationId: adminCreatePasswordResetLink
      summary: Generate a reset link manually (when no email provider is configured); audited
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: Link (valid 30 min, single use)
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/audit-events:
    get:
      tags: [admin]
      operationId: adminListAuditEvents
      summary: Audit log, newest first
      parameters:
        - name: workspace_id
          in: query
          schema: {type: string, format: uuid}
        - name: actor_user_id
          in: query
          schema: {type: string, format: uuid}
        - name: action
          in: query
          schema: {$ref: '#/components/schemas/AuditAction'}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - name: until
          in: query
          schema: {type: string, format: date-time}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/workspaces/{workspace_id}/quotas:
    parameters:
      - $ref: '#/components/parameters/WorkspaceIdPath'
    get:
      tags: [admin]
      operationId: adminListQuotas
      summary: Workspace default quota and per-user overrides
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Quota'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [admin]
      operationId: adminUpsertQuota
      summary: Create or replace the quota row for (workspace, user_id|null)
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotaUpsert'}
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quota'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/gpus/{gpu_id}:
    parameters:
      - name: gpu_id
        in: path
        required: true
        schema: {type: string, pattern: '^[a-z0-9_-]{1,32}$', examples: [cuda0]}
    patch:
      tags: [admin]
      operationId: adminUpdateGpu
      summary: Drain (finish current run, take no new ones), disable or re-enable a GPU
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: {type: string, enum: [online, draining, disabled]}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GpuNode'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/system:
    get:
      tags: [admin]
      operationId: adminGetSystem
      summary: Versions, storage usage, queue depth, worker heartbeats, email provider status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

  # =============================================================================================
  # OPS (root, not under /api/v1)
  # =============================================================================================
  /healthz:
    servers:
      - url: https://hibiscus.example.com
      - url: http://127.0.0.1:18000
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness (process up). Public.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}
  /readyz:
    servers:
      - url: http://127.0.0.1:18000
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness (Postgres, Redis, MinIO reachable; migrations at head). Internal only.
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503':
          description: Not ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
  /metrics:
    servers:
      - url: http://api:8000
        description: Docker-internal only; the reverse proxy returns 404 for /metrics
    get:
      tags: [ops]
      operationId: prometheusMetrics
      summary: Prometheus exposition format. Internal only.
      security: []
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema: {type: string}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: hb_access
      description: |
        EdDSA (Ed25519) JWT, 15 min, `HttpOnly; Secure; SameSite=Strict; Path=/api`. Claims:
        `sub` (user id), `sid` (session id), `mfa` (bool), `iat`, `exp`, `iss=hibiscus`, `aud=hibiscus-api`.
        Unsafe methods additionally require `X-CSRF-Token` equal to the `hb_csrf` cookie
        (403 `csrf_failed`). Expired => 401 `token_expired` (client calls `/auth/refresh`).
    refreshCookie:
      type: apiKey
      in: cookie
      name: hb_refresh
      description: Opaque 32-byte random token (base64url), `HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`. Rotated on every refresh; idle 7 d, absolute 30 d.
    patAuth:
      type: http
      scheme: bearer
      bearerFormat: 'hbp_<8 char prefix>_<43 char base64url secret>'
      description: |
        Personal Access Token bound to one workspace. Scopes (listed per operation as roles):
        `datasets:read`, `datasets:write` (implies datasets:read), `runs:read`, `runs:write`
        (implies runs:read), `models:read`. Missing scope => 403 `insufficient_scope`.
        An empty scope list on an operation means any valid PAT. PATs can never call `/admin/*`,
        `/auth/*` (except `/auth/me`), or member/invite/token management.

  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated unsafe requests (double-submit of `hb_csrf`). Ignored for bearer PAT.
      schema: {type: string, minLength: 32, maxLength: 128}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9_.:-]+$'}
    RangeHeader:
      name: Range
      in: header
      required: false
      description: Single range only, `bytes=<start>-[<end>]`
      schema: {type: string, pattern: '^bytes=[0-9]+-[0-9]*$'}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`
      schema: {type: string, maxLength: 512}
    WorkspaceIdQuery:
      name: workspace_id
      in: query
      required: true
      schema: {type: string, format: uuid}
    WorkspaceIdPath:
      name: workspace_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DatasetIdPath:
      name: dataset_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    VersionIdPath:
      name: version_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UploadIdPath:
      name: upload_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunIdPath:
      name: run_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ModelIdPath:
      name: model_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    StepPath:
      name: step
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    PolicyTypePath:
      name: policy_type
      in: path
      required: true
      schema: {$ref: '#/components/schemas/PolicyType'}

  headers:
    SetSessionCookies:
      description: '`hb_access`, `hb_refresh`, `hb_csrf` (the latter readable by JS: `Secure; SameSite=Strict; Path=/`)'
      schema: {type: string}
    ClearSessionCookies:
      description: Expires `hb_access`, `hb_refresh`
      schema: {type: string}
    ETag:
      schema: {type: string}
    AcceptRanges:
      schema: {type: string, const: bytes}
    ContentRange:
      schema: {type: string, examples: ['bytes 0-1048575/206699768']}
    ContentDisposition:
      schema: {type: string, examples: ['attachment; filename="act_picknplace-42-step10000.zip"']}
    Location:
      schema: {type: string, format: uri-reference}
    RetryAfter:
      description: Seconds
      schema: {type: integer, minimum: 1}

  responses:
    BadRequest:
      description: Malformed request (`bad_request`, `turnstile_failed`, `one_time_token_invalid`, ...)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: No / invalid / expired credentials
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Authenticated but not allowed (`forbidden`, `insufficient_scope`, `csrf_failed`, `quota_exceeded`, ...)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource does not exist or is not visible to the caller
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State conflict (see `code`)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Gone:
      description: Expired or already-used link
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    LengthRequired:
      description: Content-Length missing
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: Body or declared size too large
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RangeNotSatisfiable:
      description: Range outside the resource
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationFailed:
      description: Body/params failed validation; `errors[]` lists each field
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Locked:
      description: Account temporarily locked (`account_locked`), see Retry-After
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    FeatureDisabled:
      description: >-
        The operation is not enabled on this server (`service_unavailable` with
        `params.reason = feature_disabled`, `params.feature` names it). Not retryable (CR-BE-P5-4).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ------------------------------------------------------------------------------------------
    # Errors & pagination
    # ------------------------------------------------------------------------------------------
    Problem:
      type: object
      description: RFC 9457 problem details. `type` = `https://hibiscus.example.com/problems/<code>`.
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string, description: Short English summary (stable per code)}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, description: English, human-oriented, may contain specifics}
        instance: {type: string, format: uri-reference, description: Request path}
        code: {$ref: '#/components/schemas/ErrorCode'}
        request_id: {type: string}
        errors:
          type: array
          description: Field errors for `validation_failed` (and `preflight_failed` blockers)
          items: {$ref: '#/components/schemas/FieldError'}
        retry_after_s: {type: integer, minimum: 1}
        missing_parts:
          type: array
          description: For `upload_incomplete`
          items: {type: integer, minimum: 1}
        params:
          type: object
          description: "Interpolation params for the localised message, e.g. {\"limit_gb\": 50}"
          additionalProperties: true
    FieldError:
      type: object
      required: [loc, code, message]
      properties:
        loc:
          type: array
          description: JSON path, e.g. `["body","config","policy","chunk_size"]`
          items:
            oneOf:
              - type: string
              - type: integer
        code: {type: string, description: 'pydantic / JSON Schema keyword, e.g. `minimum`, `required`, `pattern`, `policy_config_invalid`'}
        message: {type: string}
    ErrorCode:
      type: string
      description: |
        Stable error catalogue (HTTP status in brackets). New codes require a contract bump.
        General: bad_request [400], validation_failed [422], unauthenticated [401], token_expired [401],
        forbidden [403], insufficient_scope [403], csrf_failed [403], not_found [404], conflict [409],
        gone [410], length_required [411], payload_too_large [413], unsupported_media_type [415],
        range_not_satisfiable [416], rate_limited [429], internal_error [500], service_unavailable [503].
        An operation this server does not run answers HTTP 501 with code service_unavailable and
        `params.reason = feature_disabled` (`FeatureDisabled` response).
        Auth: invalid_credentials [401], account_locked [423], account_disabled [403],
        email_not_verified [403], mfa_invalid_code [401], mfa_token_invalid [401],
        mfa_enrollment_required [403], mfa_required_by_role [409], mfa_already_enabled [409],
        mfa_reauth_required [403], turnstile_failed [400], refresh_reuse_detected [401],
        session_revoked [401], token_revoked [401], password_too_weak [422], password_breached [422],
        password_incorrect [401], one_time_token_invalid [400], invite_invalid [404], invite_expired [410],
        invite_email_mismatch [403], email_taken [409].
        Workspaces: workspace_slug_taken [409], workspace_not_empty [409], last_owner [409],
        member_exists [409], quota_exceeded [403].
        Datasets/uploads: dataset_name_taken [409], dataset_in_use [409], dataset_version_not_ready [409],
        dataset_version_duplicate [409], dataset_schema_mismatch [422], hf_uri_invalid [422],
        hf_token_missing [409], upload_not_active [409], upload_incomplete [409],
        upload_part_out_of_range [422], upload_part_size_invalid [422], upload_part_checksum_mismatch [422],
        upload_too_large [413], archive_format_unsupported [422].
        Runs: policy_unknown [404], policy_not_trainable [422], policy_config_invalid [422],
        policy_requires_peft [422], preflight_failed [422], gpu_unknown [422],
        gpu_insufficient_vram [422], run_invalid_transition [409], run_not_resumable [409],
        checkpoint_not_found [404].
        Models/jobs: model_not_ready [409], hub_repo_invalid [422], job_not_cancellable [409].
      enum:
        - bad_request
        - validation_failed
        - unauthenticated
        - token_expired
        - forbidden
        - insufficient_scope
        - csrf_failed
        - not_found
        - conflict
        - gone
        - length_required
        - payload_too_large
        - unsupported_media_type
        - range_not_satisfiable
        - rate_limited
        - internal_error
        - service_unavailable
        - invalid_credentials
        - account_locked
        - account_disabled
        - email_not_verified
        - mfa_invalid_code
        - mfa_token_invalid
        - mfa_enrollment_required
        - mfa_required_by_role
        - mfa_already_enabled
        - mfa_reauth_required
        - turnstile_failed
        - refresh_reuse_detected
        - session_revoked
        - token_revoked
        - password_too_weak
        - password_breached
        - password_incorrect
        - one_time_token_invalid
        - invite_invalid
        - invite_expired
        - invite_email_mismatch
        - email_taken
        - workspace_slug_taken
        - workspace_not_empty
        - last_owner
        - member_exists
        - quota_exceeded
        - dataset_name_taken
        - dataset_in_use
        - dataset_version_not_ready
        - dataset_version_duplicate
        - dataset_schema_mismatch
        - hf_uri_invalid
        - hf_token_missing
        - upload_not_active
        - upload_incomplete
        - upload_part_out_of_range
        - upload_part_size_invalid
        - upload_part_checksum_mismatch
        - upload_too_large
        - archive_format_unsupported
        - policy_unknown
        - policy_not_trainable
        - policy_config_invalid
        - policy_requires_peft
        - preflight_failed
        - gpu_unknown
        - gpu_insufficient_vram
        - run_invalid_transition
        - run_not_resumable
        - checkpoint_not_found
        - model_not_ready
        - hub_repo_invalid
        - job_not_cancellable
    NextCursor:
      type: [string, 'null']
      description: Null on the last page
    ResourceName:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[^\x00-\x1f\x7f]+$'
    Slug:
      type: string
      pattern: '^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$'
    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'
    Locale:
      type: string
      enum: [vi, en]
    Password:
      type: string
      minLength: 12
      maxLength: 256
      writeOnly: true
      description: argon2id; >= 12 chars; rejected if in the offline breached-password list (422 `password_breached`)
    TotpCode:
      type: string
      pattern: '^[0-9]{6}$'
    TurnstileToken:
      type: string
      maxLength: 2048
      description: Cloudflare Turnstile response token (required when AuthConfig.turnstile_site_key is set)

    # ------------------------------------------------------------------------------------------
    # Auth / users
    # ------------------------------------------------------------------------------------------
    AuthConfig:
      type: object
      required: [turnstile_site_key, email_delivery_enabled, password_min_length, supported_locales]
      properties:
        turnstile_site_key: {type: [string, 'null']}
        email_delivery_enabled: {type: boolean}
        password_min_length: {type: integer, const: 12}
        supported_locales:
          type: array
          items: {$ref: '#/components/schemas/Locale'}
    User:
      type: object
      required: [id, email, display_name, locale, email_verified, mfa_enabled, is_platform_admin, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        display_name: {type: string}
        locale: {$ref: '#/components/schemas/Locale'}
        email_verified: {type: boolean}
        mfa_enabled: {type: boolean}
        is_platform_admin: {type: boolean}
        created_at: {type: string, format: date-time}
    UserRef:
      type: object
      required: [id, display_name]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string}
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: {type: string, minLength: 1, maxLength: 100}
        locale: {$ref: '#/components/schemas/Locale'}
    Me:
      type: object
      required: [user, memberships, auth_method, mfa_verified, mfa_enrollment_required]
      properties:
        user: {$ref: '#/components/schemas/User'}
        memberships:
          type: array
          items: {$ref: '#/components/schemas/Membership'}
        auth_method: {type: string, enum: [session, pat]}
        session_id: {type: [string, 'null'], format: uuid}
        mfa_verified: {type: boolean}
        mfa_enrollment_required: {type: boolean}
        token:
          description: Present when auth_method=pat
          oneOf:
            - $ref: '#/components/schemas/ApiToken'
            - type: 'null'
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
        turnstile_token: {$ref: '#/components/schemas/TurnstileToken'}
    LoginSecondFactorRequest:
      type: object
      required: [mfa_token]
      additionalProperties: false
      description: Exactly one of `code` / `recovery_code`
      properties:
        mfa_token: {type: string, minLength: 32, maxLength: 128}
        code: {$ref: '#/components/schemas/TotpCode'}
        recovery_code: {type: string, pattern: '^[a-z0-9]{5}-[a-z0-9]{5}$'}
      oneOf:
        - required: [code]
        - required: [recovery_code]
    LoginResult:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, mfa_required]}
        user: {$ref: '#/components/schemas/User'}
        mfa_token:
          type: string
          description: Present when status=mfa_required; valid 5 minutes, single use
        mfa_enrollment_required: {type: boolean}
        recovery_codes_remaining: {type: integer, minimum: 0, maximum: 10}
    RegisterInviteRequest:
      type: object
      required: [invite_token, display_name, password]
      additionalProperties: false
      properties:
        invite_token: {type: string, minLength: 32, maxLength: 128}
        display_name: {type: string, minLength: 1, maxLength: 100}
        password: {$ref: '#/components/schemas/Password'}
        locale: {$ref: '#/components/schemas/Locale'}
        turnstile_token: {$ref: '#/components/schemas/TurnstileToken'}
    InvitePreview:
      type: object
      required: [workspace_name, email, role, expires_at, account_exists]
      properties:
        workspace_name: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        invited_by: {type: [string, 'null'], description: Display name}
        expires_at: {type: string, format: date-time}
        account_exists: {type: boolean, description: 'true => client should log in and call accept'}
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: {type: string, minLength: 32, maxLength: 128}
    ForgotPasswordRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 320}
        turnstile_token: {$ref: '#/components/schemas/TurnstileToken'}
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token: {type: string, minLength: 32, maxLength: 128}
        new_password: {$ref: '#/components/schemas/Password'}
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
        new_password: {$ref: '#/components/schemas/Password'}
    PasswordConfirmRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
    TotpSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: {type: string, description: Base32, 32 chars}
        otpauth_uri: {type: string, description: 'otpauth://totp/Hibiscus:<email>?secret=...&issuer=Hibiscus&algorithm=SHA1&digits=6&period=30'}
    TotpCodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: {$ref: '#/components/schemas/TotpCode'}
    TotpDisableRequest:
      type: object
      required: [password, code]
      additionalProperties: false
      properties:
        password: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
        code: {$ref: '#/components/schemas/TotpCode'}
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items: {type: string, pattern: '^[a-z0-9]{5}-[a-z0-9]{5}$'}
        api_tokens_revoked:
          type: integer
          minimum: 0
          description: >-
            enableTotp only: number of the user's personal access tokens revoked because they were
            minted before 2FA was enabled. New tokens must be created from this 2FA-verified session.
    SessionInfo:
      type: object
      required: [id, created_at, last_used_at, expires_at, current, mfa_verified]
      properties:
        id: {type: string, format: uuid, description: Session family id}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        ip: {type: [string, 'null']}
        user_agent: {type: [string, 'null']}
        current: {type: boolean}
        mfa_verified: {type: boolean}
    PatScope:
      type: string
      enum: ['datasets:read', 'datasets:write', 'runs:read', 'runs:write', 'models:read']
    ApiToken:
      type: object
      required: [id, name, prefix, workspace_id, scopes, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string, pattern: '^[A-Za-z0-9]{8}$', description: 'Shown as `hbp_<prefix>_…`'}
        workspace_id: {type: string, format: uuid}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/PatScope'}
        created_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        last_used_ip: {type: [string, 'null']}
        revoked_at: {type: [string, 'null'], format: date-time}
    ApiTokenCreate:
      type: object
      required: [name, workspace_id, scopes]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        workspace_id: {type: string, format: uuid}
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/PatScope'}
        expires_in_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 365
          default: 90
          description: null = never expires (UI shows a warning)
    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token: {type: string, description: Plaintext, shown once, 'hbp_<prefix>_<secret>'}
    SecretStatus:
      type: object
      required: [present]
      properties:
        present: {type: boolean}
        hint: {type: [string, 'null'], description: 'Last 4 chars, e.g. `…x9Qa`'}
        updated_at: {type: [string, 'null'], format: date-time}

    # ------------------------------------------------------------------------------------------
    # Workspaces
    # ------------------------------------------------------------------------------------------
    WorkspaceRole:
      type: string
      enum: [owner, admin, member, viewer]
      description: |
        owner: everything incl. delete workspace, manage owners. admin: members/invites (non-owner),
        all resources. member: create datasets/runs; edit/cancel/delete own runs and datasets;
        read all. viewer: read-only. owner/admin require 2FA.
    Workspace:
      type: object
      required: [id, slug, name, my_role, created_at]
      properties:
        id: {type: string, format: uuid}
        slug: {$ref: '#/components/schemas/Slug'}
        name: {type: string}
        my_role: {$ref: '#/components/schemas/WorkspaceRole'}
        member_count: {type: integer}
        settings: {$ref: '#/components/schemas/WorkspaceSettings'}
        created_at: {type: string, format: date-time}
    WorkspaceSettings:
      type: object
      additionalProperties: false
      properties:
        default_heldout_fraction: {type: number, minimum: 0, maximum: 0.49, default: 0.1}
        default_gpu: {type: string, default: auto, description: '`auto` or a gpu id'}
        notify_on: {type: array, items: {type: string, enum: [run.succeeded, run.failed, run.stalled, model.ready, dataset.ready, dataset.invalid]}}
    WorkspaceCreate:
      type: object
      required: [name, slug]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/ResourceName'}
        slug: {$ref: '#/components/schemas/Slug'}
    WorkspaceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {$ref: '#/components/schemas/ResourceName'}
        settings: {$ref: '#/components/schemas/WorkspaceSettings'}
    Membership:
      type: object
      required: [workspace_id, workspace_slug, workspace_name, role]
      properties:
        workspace_id: {type: string, format: uuid}
        workspace_slug: {$ref: '#/components/schemas/Slug'}
        workspace_name: {type: string}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
    Member:
      type: object
      required: [user, email, role, mfa_enabled, joined_at]
      properties:
        user: {$ref: '#/components/schemas/UserRef'}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        mfa_enabled: {type: boolean}
        joined_at: {type: string, format: date-time}
    Invite:
      type: object
      required: [id, email, role, expires_at, created_at, status]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/WorkspaceRole'}
        invited_by: {$ref: '#/components/schemas/UserRef'}
        status: {type: string, enum: [pending, accepted, expired, revoked]}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    InviteCreate:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 320}
        role:
          type: string
          enum: [admin, member, viewer]
    InviteCreated:
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          properties:
            accept_url:
              type: [string, 'null']
              format: uri
              description: Only when email delivery is disabled (admin shares it manually)
    QuotaLimits:
      type: object
      required: [max_concurrent_runs, max_queued_runs, gpu_hours_per_month, storage_bytes, max_upload_bytes]
      properties:
        max_concurrent_runs: {type: integer, minimum: 0}
        max_queued_runs: {type: integer, minimum: 0}
        gpu_hours_per_month: {type: number, minimum: 0}
        storage_bytes: {type: integer, minimum: 0}
        max_upload_bytes: {type: integer, minimum: 0}
    WorkspaceUsage:
      type: object
      required: [workspace, me]
      properties:
        workspace:
          type: object
          required: [limits, storage_bytes_used, gpu_hours_this_month, active_runs, queued_runs]
          properties:
            limits: {$ref: '#/components/schemas/QuotaLimits'}
            storage_bytes_used: {type: integer}
            gpu_hours_this_month: {type: number}
            active_runs: {type: integer}
            queued_runs: {type: integer}
        me:
          type: object
          required: [limits, gpu_hours_this_month, active_runs, queued_runs, fair_share_gpu_hours_7d]
          properties:
            limits: {$ref: '#/components/schemas/QuotaLimits'}
            gpu_hours_this_month: {type: number}
            active_runs: {type: integer}
            queued_runs: {type: integer}
            fair_share_gpu_hours_7d: {type: number, description: Decayed usage used by the scheduler}
    Quota:
      allOf:
        - $ref: '#/components/schemas/QuotaLimits'
        - type: object
          required: [id, workspace_id, user_id]
          properties:
            id: {type: string, format: uuid}
            workspace_id: {type: string, format: uuid}
            user_id: {type: [string, 'null'], format: uuid, description: null = workspace default}
    QuotaUpsert:
      allOf:
        - $ref: '#/components/schemas/QuotaLimits'
        - type: object
          required: [user_id]
          properties:
            user_id: {type: [string, 'null'], format: uuid}
    WorkspaceStreamEvent:
      type: object
      description: 'SSE: `event: <event>` / `data: <payload JSON>`; heartbeat payload `{"ts": ...}`'
      required: [event, data]
      properties:
        event:
          type: string
          enum: [heartbeat, run.status, dataset_version.status, model.status, job.status, notification, estimate.ready]
        data:
          oneOf:
            - $ref: '#/components/schemas/Heartbeat'
            - $ref: '#/components/schemas/RunStatusEvent'
            - $ref: '#/components/schemas/ResourceStatusEvent'
            - $ref: '#/components/schemas/Notification'
    ResourceStatusEvent:
      type: object
      required: [resource, id, status, ts]
      properties:
        resource: {type: string, enum: [dataset_version, model, job, estimate]}
        id: {type: string, format: uuid}
        status: {type: string}
        error_code: {type: [string, 'null']}
        ts: {type: string, format: date-time}

    # ------------------------------------------------------------------------------------------
    # Notifications
    # ------------------------------------------------------------------------------------------
    Notification:
      type: object
      required: [id, kind, params, created_at, read]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: [string, 'null'], format: uuid}
        kind:
          type: string
          enum: [run.succeeded, run.failed, run.stalled, run.cancelled, model.ready, model.failed, dataset.ready, dataset.invalid, invite.accepted, quota.warning]
        params: {type: object, additionalProperties: true, description: i18n interpolation params}
        link: {type: [string, 'null'], description: SPA path}
        read: {type: boolean}
        created_at: {type: string, format: date-time}
    NotificationPage:
      type: object
      required: [items, next_cursor, unread_count]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
        unread_count: {type: integer}
    NotificationChannelKind:
      type: string
      enum: [email, discord, telegram, webhook]
    NotificationChannel:
      type: object
      required: [id, kind, events, enabled, target_hint, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/NotificationChannelKind'}
        events:
          type: array
          items: {type: string}
        enabled: {type: boolean}
        target_hint: {type: string, description: 'Redacted target, e.g. `discord.com/api/webhooks/…/abcd`'}
        created_at: {type: string, format: date-time}
    NotificationChannelCreate:
      type: object
      required: [kind, target, events]
      additionalProperties: false
      properties:
        kind: {$ref: '#/components/schemas/NotificationChannelKind'}
        target:
          type: string
          maxLength: 512
          writeOnly: true
          description: 'email: address; discord/webhook: https URL (server blocks private IPs, SSRF); telegram: `<bot_token>:<chat_id>`'
        events:
          type: array
          minItems: 1
          items: {type: string, enum: [run.succeeded, run.failed, run.stalled, model.ready, dataset.ready, dataset.invalid]}
    # ------------------------------------------------------------------------------------------
    # Datasets
    # ------------------------------------------------------------------------------------------
    DatasetCreate:
      type: object
      required: [workspace_id, name]
      additionalProperties: false
      properties:
        workspace_id: {type: string, format: uuid}
        name: {$ref: '#/components/schemas/ResourceName'}
        description: {type: string, maxLength: 2000}
    DatasetUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {$ref: '#/components/schemas/ResourceName'}
        description: {type: string, maxLength: 2000}
    Dataset:
      type: object
      required: [id, workspace_id, name, slug, description, version_count, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string, description: 'Derived from name; used as `repo_id` suffix `local/<slug>`'}
        description: {type: string}
        created_by: {$ref: '#/components/schemas/UserRef'}
        version_count: {type: integer}
        latest_version:
          oneOf:
            - $ref: '#/components/schemas/DatasetVersionSummary'
            - type: 'null'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DatasetPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Dataset'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    DatasetVersionStatus:
      type: string
      enum: [pending, unpacking, validating, ready, invalid, failed]
    DatasetSource:
      type: string
      enum: [upload, hf_import, merge]
    DatasetVersionSummary:
      type: object
      required: [id, dataset_id, version, status, source, created_at]
      properties:
        id: {type: string, format: uuid}
        dataset_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/DatasetVersionStatus'}
        source: {$ref: '#/components/schemas/DatasetSource'}
        total_episodes: {type: [integer, 'null']}
        total_frames: {type: [integer, 'null']}
        fps: {type: [number, 'null']}
        size_bytes: {type: [integer, 'null']}
        created_at: {type: string, format: date-time}
    FeatureSpec:
      type: object
      description: One entry of LeRobot meta/info.json `features` (verbatim)
      required: [dtype, shape]
      properties:
        dtype: {type: string, examples: [float32, int64, video, image]}
        shape:
          type: array
          items: {type: integer}
        names:
          type: [array, object, 'null']
        info: {type: [object, 'null'], additionalProperties: true}
    DatasetVersion:
      allOf:
        - $ref: '#/components/schemas/DatasetVersionSummary'
        - type: object
          required: [content_hash, codebase_version, robot_type, camera_keys, features, state_dim, action_dim, joint_names, validation_summary]
          properties:
            content_hash: {oneOf: [{$ref: '#/components/schemas/Sha256Hex'}, {type: 'null'}]}
            source_ref: {type: [string, 'null'], examples: ['hf://lerobot/svla_so101_pickplace@main']}
            merged_from:
              type: [array, 'null']
              items: {type: string, format: uuid}
            codebase_version: {type: [string, 'null'], examples: [v3.0]}
            converted_from: {type: [string, 'null'], examples: [v2.1]}
            robot_type: {type: [string, 'null'], examples: [so_follower]}
            camera_keys:
              type: array
              items: {type: string}
              examples: [[observation.images.wrist_cam]]
            features:
              type: [object, 'null']
              additionalProperties: {$ref: '#/components/schemas/FeatureSpec'}
            state_dim: {type: [integer, 'null']}
            action_dim: {type: [integer, 'null']}
            joint_names:
              type: array
              items: {type: string}
            tasks:
              type: array
              items: {type: string}
            validation_summary:
              oneOf:
                - $ref: '#/components/schemas/ValidationSummary'
                - type: 'null'
            error_code: {type: [string, 'null'], description: Infra failure code when status=failed (e.g. upload_checksum_mismatch, unpack_failed)}
            ready_at: {type: [string, 'null'], format: date-time}
    DatasetVersionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DatasetVersionSummary'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    DatasetVersionAccepted:
      type: object
      required: [dataset, version, job]
      properties:
        dataset: {$ref: '#/components/schemas/Dataset'}
        version: {$ref: '#/components/schemas/DatasetVersionSummary'}
        job: {$ref: '#/components/schemas/Job'}
    HfImportRequest:
      type: object
      required: [workspace_id, hf_uri]
      additionalProperties: false
      description: Exactly one of dataset_id / new_dataset_name
      properties:
        workspace_id: {type: string, format: uuid}
        dataset_id: {type: string, format: uuid}
        new_dataset_name: {$ref: '#/components/schemas/ResourceName'}
        hf_uri:
          type: string
          pattern: '^hf://[A-Za-z0-9][A-Za-z0-9_.-]{0,95}/[A-Za-z0-9][A-Za-z0-9_.-]{0,95}(@[A-Za-z0-9_./-]{1,128})?$'
          examples: ['hf://lerobot/svla_so101_pickplace@main']
      oneOf:
        - required: [dataset_id]
        - required: [new_dataset_name]
    MergeRequest:
      type: object
      required: [workspace_id, source_version_ids]
      additionalProperties: false
      properties:
        workspace_id: {type: string, format: uuid}
        dataset_id: {type: string, format: uuid}
        new_dataset_name: {$ref: '#/components/schemas/ResourceName'}
        source_version_ids:
          type: array
          minItems: 2
          maxItems: 20
          uniqueItems: true
          items: {type: string, format: uuid}
      oneOf:
        - required: [dataset_id]
        - required: [new_dataset_name]
    ValidationStepId:
      type: string
      description: Order is fixed (PLAN 3.2) - checksum and unpack precede the 5 validation steps.
      enum: [checksum, unpack, structure, schema, decode, timestamps, stats]
    ValidationSeverity:
      type: string
      enum: [error, warning, info]
    ValidationIssue:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum:
            - checksum_mismatch
            - archive_corrupt
            - archive_unsafe_path
            - archive_symlink
            - archive_bomb
            - archive_too_large
            - dataset_root_not_found
            - multiple_dataset_roots
            - missing_file
            - info_json_invalid
            - unsupported_codebase_version
            - conversion_failed
            - feature_missing
            - feature_shape_invalid
            - joint_names_mismatch
            - no_camera
            - camera_shape_mismatch
            - video_missing
            - video_decode_failed
            - frame_count_mismatch
            - timestamp_irregular
            - timestamp_fps_mismatch
            - nan_values
            - stats_missing
            - stats_mismatch
            - episode_too_short
            - task_missing
        severity: {$ref: '#/components/schemas/ValidationSeverity'}
        message: {type: string, description: English; UI localises by code + params}
        params: {type: object, additionalProperties: true}
        episode_index: {type: [integer, 'null']}
        path: {type: [string, 'null'], description: Path relative to dataset root}
        feature: {type: [string, 'null']}
    ValidationStep:
      type: object
      required: [id, status, issues]
      properties:
        id: {$ref: '#/components/schemas/ValidationStepId'}
        status: {type: string, enum: [pending, running, passed, warning, failed, skipped]}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        progress: {type: number, minimum: 0, maximum: 1}
        issues:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/ValidationIssue'}
        issues_truncated: {type: integer, minimum: 0, description: Number of issues beyond the 500 kept}
    ValidationSummary:
      type: object
      required: [result, errors, warnings]
      properties:
        result: {type: string, enum: [running, passed, passed_with_warnings, failed]}
        errors: {type: integer}
        warnings: {type: integer}
    ValidationReport:
      type: object
      required: [dataset_version_id, validator_version, lerobot_version, summary, steps]
      properties:
        dataset_version_id: {type: string, format: uuid}
        job_id: {type: [string, 'null'], format: uuid}
        validator_version: {type: string}
        lerobot_version: {type: string}
        summary: {$ref: '#/components/schemas/ValidationSummary'}
        steps:
          type: array
          minItems: 7
          maxItems: 7
          items: {$ref: '#/components/schemas/ValidationStep'}
        recomputed_stats_max_rel_diff:
          type: [object, 'null']
          description: 'feature key -> {mean, std, min, max} max relative difference vs stats.json'
          additionalProperties: true
    DatasetPreview:
      type: object
      required: [dataset_version_id, fps, camera_keys, episodes, length_histogram]
      properties:
        dataset_version_id: {type: string, format: uuid}
        fps: {type: number}
        camera_keys:
          type: array
          items: {type: string}
        episodes:
          type: array
          items: {$ref: '#/components/schemas/EpisodeSummary'}
        length_histogram:
          type: object
          required: [bin_edges_s, counts]
          properties:
            bin_edges_s:
              type: array
              items: {type: number}
            counts:
              type: array
              items: {type: integer}
    EpisodeSummary:
      type: object
      required: [index, length, duration_s, tasks, thumbnails]
      properties:
        index: {type: integer, minimum: 0}
        length: {type: integer, description: Frames}
        duration_s: {type: number}
        tasks:
          type: array
          items: {type: string}
        thumbnails:
          type: object
          description: camera key -> media path (use with getDatasetMedia)
          additionalProperties: {type: string}
        has_issues: {type: boolean}
    EpisodeDetail:
      type: object
      required: [index, length, fps, timestamps, series, videos]
      properties:
        index: {type: integer}
        length: {type: integer}
        fps: {type: number}
        timestamps:
          type: array
          description: Seconds from episode start, downsampled (shared x-axis)
          items: {type: number}
        series:
          type: array
          description: One per feature dimension (observation.state[i], action[i])
          items:
            type: object
            required: [feature, dim, name, values]
            properties:
              feature: {type: string, examples: [observation.state, action]}
              dim: {type: integer}
              name: {type: string, examples: [shoulder_pan.pos]}
              values:
                type: array
                items: {type: [number, 'null'], description: null = NaN}
        videos:
          type: array
          items:
            type: object
            required: [camera_key, media_path, from_timestamp_s, to_timestamp_s, codec, width, height]
            properties:
              camera_key: {type: string}
              media_path: {type: string, description: 'e.g. videos/observation.images.wrist_cam/chunk-000/file-000.mp4'}
              from_timestamp_s: {type: number, description: Seek offset inside the (concatenated v3.0) mp4}
              to_timestamp_s: {type: number}
              codec: {type: string, examples: [av1]}
              width: {type: integer}
              height: {type: integer}
              browser_playable_hint: {type: boolean, description: False for codecs some browsers cannot decode (UI shows fallback)}
              preview_media_path:
                type: [string, 'null']
                description: 'Per-episode H.264 preview clip (<=480p, starts at t=0, no seek offset), e.g. previews/observation.images.wrist_cam/episode_000003.mp4; served via the same media endpoint. null until validation has generated it.'
              thumbnail_media_path: {type: [string, 'null'], description: 'JPEG thumbnail of the first frame, e.g. previews/observation.images.wrist_cam/episode_000003.jpg'}

    # ------------------------------------------------------------------------------------------
    # Uploads
    # ------------------------------------------------------------------------------------------
    UploadStatus:
      type: string
      enum: [active, completing, completed, aborted, expired, failed]
    ArchiveFormat:
      type: string
      enum: [zip, tar, tar.gz, tar.zst, rar]
      description: rar = RAR4/RAR5 via libarchive. Directories are tarred client-side by the CLI (format tar).
    UploadInit:
      type: object
      required: [workspace_id, filename, size, sha256]
      additionalProperties: false
      description: Exactly one of dataset_id (new version of an existing dataset) / new_dataset_name
      properties:
        workspace_id: {type: string, format: uuid}
        dataset_id: {type: string, format: uuid}
        new_dataset_name: {$ref: '#/components/schemas/ResourceName'}
        filename: {type: string, minLength: 1, maxLength: 255, examples: [Picknplace_20261114_221710.rar]}
        size: {type: integer, minimum: 1, maximum: 671088640000, description: Bytes (hard cap 625 GiB = 10000 x 64 MiB; quota usually lower)}
        sha256: {$ref: '#/components/schemas/Sha256Hex'}
        archive_format:
          oneOf:
            - $ref: '#/components/schemas/ArchiveFormat'
            - type: 'null'
          description: null => detected from magic bytes / extension
        part_size: {type: integer, minimum: 5242880, maximum: 67108864, default: 67108864}
      oneOf:
        - required: [dataset_id]
        - required: [new_dataset_name]
    UploadPart:
      type: object
      required: [part_number, size, sha256]
      properties:
        part_number: {type: integer, minimum: 1, maximum: 10000}
        size: {type: integer}
        sha256: {$ref: '#/components/schemas/Sha256Hex'}
        received_at: {type: string, format: date-time}
    UploadSession:
      type: object
      required: [id, workspace_id, filename, size, sha256, archive_format, part_size, part_count, parts, status, expires_at, created_at]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        dataset_id: {type: [string, 'null'], format: uuid}
        new_dataset_name: {type: [string, 'null']}
        filename: {type: string}
        size: {type: integer}
        sha256: {$ref: '#/components/schemas/Sha256Hex'}
        archive_format: {$ref: '#/components/schemas/ArchiveFormat'}
        part_size: {type: integer}
        part_count: {type: integer}
        parts:
          type: array
          description: Received parts, ascending part_number
          items: {$ref: '#/components/schemas/UploadPart'}
        bytes_received: {type: integer}
        status: {$ref: '#/components/schemas/UploadStatus'}
        error_code: {type: [string, 'null']}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        dataset_version_id: {type: [string, 'null'], format: uuid}
    UploadPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/UploadSession'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    UploadCompleted:
      type: object
      required: [upload, dataset, version, job]
      properties:
        upload: {$ref: '#/components/schemas/UploadSession'}
        dataset: {$ref: '#/components/schemas/Dataset'}
        version: {$ref: '#/components/schemas/DatasetVersionSummary'}
        job: {$ref: '#/components/schemas/Job'}

    # ------------------------------------------------------------------------------------------
    # Jobs
    # ------------------------------------------------------------------------------------------
    JobKind:
      type: string
      enum: [validate_dataset, import_hf_dataset, merge_datasets, export_model, eval_checkpoint, push_model_hub, estimate_resources]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, workspace_id, kind, status, progress, created_at]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/JobKind'}
        status: {$ref: '#/components/schemas/JobStatus'}
        progress: {type: number, minimum: 0, maximum: 1}
        stage: {type: [string, 'null'], description: 'Human stage label key, e.g. `validate.decode`'}
        error_code: {type: [string, 'null']}
        error_message: {type: [string, 'null']}
        result: {type: [object, 'null'], additionalProperties: true}
        run_id: {type: [string, 'null'], format: uuid}
        dataset_version_id: {type: [string, 'null'], format: uuid}
        model_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    JobPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Job'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}

    # ------------------------------------------------------------------------------------------
    # Policies
    # ------------------------------------------------------------------------------------------
    PolicyType:
      type: string
      enum: [act, diffusion, vqbet, tdmpc, smolvla, pi0, pi05]
    OnnxSupport:
      type: string
      enum: [full, split, none]
      description: 'full: single graph; split: encoder + denoiser graphs, loop in infer_onnx.py; none: no ONNX in v1'
    PolicySummary:
      type: object
      required: [type, display_name, trainable, onnx, requires_peft, requires_reward, gpu_support, schema_etag]
      properties:
        type: {$ref: '#/components/schemas/PolicyType'}
        display_name: {type: string, examples: [ACT]}
        trainable: {type: boolean}
        onnx: {$ref: '#/components/schemas/OnnxSupport'}
        onnx_reason_key: {type: [string, 'null'], description: 'i18n key explaining missing ONNX'}
        requires_peft: {type: boolean, description: 'pi0/pi05: only LoRA/PEFT fine-tuning allowed'}
        requires_reward: {type: boolean, description: 'tdmpc: dataset must contain next.reward'}
        requires_language: {type: boolean, description: 'smolvla/pi0/pi05 use the task string'}
        gpu_support:
          type: object
          description: gpu name -> support level
          additionalProperties:
            type: string
            enum: [supported, limited, unsupported]
        schema_etag: {type: string}
        experimental: {type: boolean}
    Preset:
      type: object
      required: [id, label_key, train, policy]
      properties:
        id: {type: string, enum: [quick, standard, finetune]}
        label_key: {type: string, examples: [preset.quick]}
        train: {type: object, additionalProperties: true, description: Partial train options}
        policy: {type: object, additionalProperties: true, description: Partial policy options}
        requires_init_from: {type: boolean}
    PolicyDetail:
      allOf:
        - $ref: '#/components/schemas/PolicySummary'
        - type: object
          required: [policy_schema, train_schema, presets]
          properties:
            policy_schema:
              type: object
              description: Contents of api/policy-schemas/<type>.json (JSON Schema 2020-12 with x-hibiscus-* annotations)
              additionalProperties: true
            train_schema:
              type: object
              description: Contents of api/policy-schemas/train.json
              additionalProperties: true
            presets:
              type: array
              items: {$ref: '#/components/schemas/Preset'}

    # ------------------------------------------------------------------------------------------
    # Runs
    # ------------------------------------------------------------------------------------------
    RunStatus:
      type: string
      enum: [queued, preparing, running, pausing, paused, exporting, succeeded, failed, cancelling, cancelled]
      description: State machine in docs/spec/run-lifecycle.md
    MixedPrecision:
      type: string
      enum: ['no', fp16, bf16]
    RunErrorCode:
      type: string
      description: Run.error_code catalogue (docs/spec/run-lifecycle.md §6). `infra` codes are auto-retried once.
      enum:
        - config_invalid
        - dataset_unavailable
        - dataset_feature_mismatch
        - oom
        - nan_loss
        - stalled
        - process_crashed
        - worker_lost
        - gpu_error
        - storage_error
        - checkpoint_corrupt
        - export_failed
        - quota_exceeded
        - internal_error
    RunConfig:
      type: object
      required: [policy, train]
      additionalProperties: false
      properties:
        policy:
          type: object
          additionalProperties: true
          description: Validated against api/policy-schemas/<policy_type>.json (only fields that differ from defaults need be sent)
        train:
          type: object
          additionalProperties: true
          description: Validated against api/policy-schemas/train.json
    InitFrom:
      type: object
      additionalProperties: false
      description: Fine-tune source (sets --policy.pretrained_path). Exactly one key.
      properties:
        model_id: {type: string, format: uuid}
        checkpoint_id: {type: string, format: uuid}
        hf_repo_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,95}/[A-Za-z0-9][A-Za-z0-9_.-]{0,95}$', examples: [lerobot/smolvla_base]}
      oneOf:
        - required: [model_id]
        - required: [checkpoint_id]
        - required: [hf_repo_id]
    ExportOptions:
      type: object
      additionalProperties: false
      properties:
        onnx: {type: boolean, default: true, description: Ignored (onnx_status=not_supported) for policies with onnx=none}
        onnx_fp16: {type: boolean, default: false}
        eval: {type: boolean, default: true, description: Run held-out offline eval and include eval/ in bundle}
        model_name: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: 'Default: dataset slug + policy type'}
    RunCreate:
      type: object
      required: [workspace_id, dataset_version_id, policy_type, config]
      additionalProperties: false
      properties:
        workspace_id: {type: string, format: uuid}
        name: {$ref: '#/components/schemas/ResourceName'}
        dataset_version_id: {type: string, format: uuid}
        policy_type: {$ref: '#/components/schemas/PolicyType'}
        preset: {type: [string, 'null'], enum: [quick, standard, finetune, null]}
        config: {$ref: '#/components/schemas/RunConfig'}
        heldout_fraction: {type: number, minimum: 0, maximum: 0.49, default: 0.1}
        heldout_episodes:
          type: [array, 'null']
          description: Explicit held-out episode indices (overrides heldout_fraction)
          items: {type: integer, minimum: 0}
        gpu: {type: string, default: auto, description: '`auto` or a GpuNode.id (e.g. cuda0)'}
        priority: {type: integer, minimum: -10, maximum: 10, default: 0, description: '> 0 requires workspace admin'}
        init_from:
          oneOf:
            - $ref: '#/components/schemas/InitFrom'
            - type: 'null'
        export: {$ref: '#/components/schemas/ExportOptions'}
        seed: {type: [integer, 'null'], minimum: 0, maximum: 4294967295, description: null => train.seed default (1000)}
    RunUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {$ref: '#/components/schemas/ResourceName'}
        priority: {type: integer, minimum: -10, maximum: 10}
        gpu: {type: string}
    RunPauseRequest:
      type: object
      additionalProperties: false
      properties:
        mode: {type: string, enum: [next_checkpoint, now], default: next_checkpoint}
    RunResumeRequest:
      type: object
      additionalProperties: false
      properties:
        gpu: {type: string, description: Override GPU for the next attempt}
        total_steps: {type: integer, minimum: 1, description: Extend training (must be > current_step)}
    RunCloneRequest:
      type: object
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/ResourceName'}
        dataset_version_id: {type: string, format: uuid}
        config: {type: object, additionalProperties: true, description: 'Deep-merged into the source config ({"policy":{...},"train":{...}})'}
        heldout_fraction: {type: number, minimum: 0, maximum: 0.49}
        gpu: {type: string}
        priority: {type: integer, minimum: -10, maximum: 10}
        init_from:
          oneOf:
            - $ref: '#/components/schemas/InitFrom'
            - type: 'null'
        export: {$ref: '#/components/schemas/ExportOptions'}
    ResourceEstimate:
      type: object
      required: [source]
      properties:
        source: {type: string, enum: [measured, cached, heuristic, pending]}
        gpu_id: {type: [string, 'null']}
        peak_vram_mb: {type: [integer, 'null']}
        sec_per_step: {type: [number, 'null']}
        total_duration_s: {type: [number, 'null']}
        measured_at: {type: [string, 'null'], format: date-time}
    PreflightCheck:
      type: object
      required: [id, severity, code, message]
      properties:
        id:
          type: string
          enum: [dataset_ready, config_schema, cross_field, camera_keys, feature_dims, policy_requirements, vram, mixed_precision, quota, gpu_available, init_from]
        severity: {$ref: '#/components/schemas/ValidationSeverity'}
        code: {type: string, description: 'ErrorCode for errors; warning code otherwise (e.g. `mixed_precision_forced_no`)'}
        message: {type: string}
        params: {type: object, additionalProperties: true}
    PreflightReport:
      type: object
      required: [ok, checks, resolved, estimate]
      properties:
        ok: {type: boolean, description: No check with severity=error}
        checks:
          type: array
          items: {$ref: '#/components/schemas/PreflightCheck'}
        resolved:
          type: object
          required: [gpu_id, mixed_precision, config, heldout_episodes, train_episodes, lerobot_args]
          properties:
            gpu_id: {type: [string, 'null'], description: null when auto and decided at dispatch}
            mixed_precision: {$ref: '#/components/schemas/MixedPrecision'}
            config: {$ref: '#/components/schemas/RunConfig'}
            heldout_episodes:
              type: array
              items: {type: integer}
            train_episodes:
              type: array
              items: {type: integer}
            lerobot_args:
              type: array
              description: argv preview (paths shown as placeholders)
              items: {type: string}
        estimate: {$ref: '#/components/schemas/ResourceEstimate'}
    RunProgress:
      type: object
      required: [current_step, total_steps]
      properties:
        current_step: {type: integer}
        total_steps: {type: integer}
        steps_per_s: {type: [number, 'null']}
        eta_s: {type: [number, 'null']}
        next_checkpoint_step: {type: [integer, 'null'], description: Next multiple of save_freq (or total_steps)}
        last_checkpoint_step: {type: [integer, 'null']}
    Run:
      type: object
      required: [id, workspace_id, number, name, status, policy_type, dataset_version_id, dataset, config, progress, created_by, created_at, updated_at, attempt, priority]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        number: {type: integer, description: 'Per-workspace sequence, shown as #42'}
        name: {type: string}
        status: {$ref: '#/components/schemas/RunStatus'}
        status_changed_at: {type: string, format: date-time}
        desired_state: {type: string, enum: [run, pause, pause_now, cancel]}
        error_code:
          oneOf:
            - $ref: '#/components/schemas/RunErrorCode'
            - type: 'null'
        error_message: {type: [string, 'null']}
        policy_type: {$ref: '#/components/schemas/PolicyType'}
        preset: {type: [string, 'null']}
        dataset_version_id: {type: string, format: uuid}
        dataset:
          type: object
          required: [id, name, version]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            version: {type: integer}
        config: {$ref: '#/components/schemas/RunConfig'}
        heldout_episodes:
          type: array
          items: {type: integer}
        seed: {type: integer}
        progress: {$ref: '#/components/schemas/RunProgress'}
        latest_metrics:
          type: object
          description: key -> last value
          additionalProperties: {type: [number, 'null']}
        gpu_id: {type: [string, 'null']}
        requested_gpu: {type: string}
        mixed_precision_requested: {$ref: '#/components/schemas/MixedPrecision'}
        mixed_precision_effective:
          oneOf:
            - $ref: '#/components/schemas/MixedPrecision'
            - type: 'null'
        priority: {type: integer}
        queue_position: {type: [integer, 'null']}
        attempt: {type: integer, description: 'Number of worker attempts so far (0 while first queued)'}
        infra_retries_used: {type: integer}
        estimate:
          oneOf:
            - $ref: '#/components/schemas/ResourceEstimate'
            - type: 'null'
        parent_run_id: {type: [string, 'null'], format: uuid}
        init_from:
          oneOf:
            - $ref: '#/components/schemas/InitFrom'
            - type: 'null'
        export: {$ref: '#/components/schemas/ExportOptions'}
        model_id: {type: [string, 'null'], format: uuid, description: Model built from the final checkpoint}
        gpu_seconds: {type: number}
        created_by: {$ref: '#/components/schemas/UserRef'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        queued_at: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        allowed_actions:
          type: array
          description: Actions valid for the caller now (UI enables buttons from this)
          items: {type: string, enum: [cancel, pause, resume, clone, edit, export, eval]}
    RunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    MetricSeries:
      type: object
      required: [key, steps, values]
      properties:
        key: {type: string}
        steps:
          type: array
          items: {type: integer}
        values:
          type: array
          items: {type: [number, 'null'], description: 'null encodes NaN; +/-Inf are clamped to null with `has_nonfinite=true`'}
        has_nonfinite: {type: boolean}
        downsampled: {type: boolean}
    MetricSeriesSet:
      type: object
      required: [run_id, series]
      properties:
        run_id: {type: string, format: uuid}
        series:
          type: array
          items: {$ref: '#/components/schemas/MetricSeries'}
    RunComparison:
      type: object
      required: [runs, series, config_diff]
      properties:
        runs:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        series:
          type: array
          items: {$ref: '#/components/schemas/MetricSeriesSet'}
        config_diff:
          type: array
          description: Only paths whose values differ between runs
          items:
            type: object
            required: [path, values]
            properties:
              path: {type: string, examples: [policy.chunk_size, train.batch_size]}
              values:
                type: array
                description: One entry per run, same order as `runs`
                items: {}
    GpuSample:
      type: object
      required: [gpu_id, ts, util_pct, mem_used_mb, mem_total_mb, temperature_c, power_w]
      properties:
        gpu_id: {type: string}
        ts: {type: string, format: date-time}
        util_pct: {type: number}
        mem_used_mb: {type: integer}
        mem_total_mb: {type: integer}
        temperature_c: {type: number}
        power_w: {type: number}
    LogSearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [line_no, byte_offset, text]
            properties:
              line_no: {type: integer}
              byte_offset: {type: integer}
              attempt: {type: integer}
              text: {type: string}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    Checkpoint:
      type: object
      required: [id, run_id, step, size_bytes, is_last, created_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        step: {type: integer}
        size_bytes: {type: integer}
        is_last: {type: boolean}
        has_training_state: {type: boolean}
        model_id: {type: [string, 'null'], format: uuid}
        eval_summary:
          type: [object, 'null']
          properties:
            action_mae: {type: number}
            action_mse: {type: number}
        created_at: {type: string, format: date-time}
    EvalMetrics:
      type: object
      description: Same document as bundle `eval/metrics.json` (docs/spec/bundle.md §5)
      required: [schema_version, run_id, step, heldout_episodes, n_frames, action_names, overall, per_joint, disclaimer_key]
      properties:
        schema_version: {type: string, const: '1'}
        run_id: {type: string, format: uuid}
        step: {type: integer}
        heldout_episodes:
          type: array
          items: {type: integer}
        n_frames: {type: integer}
        action_names:
          type: array
          items: {type: string}
        overall:
          type: object
          required: [mae, mse]
          properties:
            mae: {type: number}
            mse: {type: number}
            mae_normalized: {type: number}
        per_joint:
          type: array
          items:
            type: object
            required: [name, mae, mse]
            properties:
              name: {type: string}
              mae: {type: number}
              mse: {type: number}
        plots:
          type: array
          items:
            type: object
            required: [episode_index, path]
            properties:
              episode_index: {type: integer}
              path: {type: string, examples: [eval/plots/episode_018.png]}
        disclaimer_key: {type: string, const: eval.offline_not_success_rate}
    RunManifest:
      type: object
      description: Written by the worker at preparing (and finalised at succeeded); also embedded in MANIFEST.json.
      required: [schema_version, run_id, lerobot_version, torch_version, cuda_version, python_version, image_digest, gpu, dataset, seed, heldout_episodes, train_episodes, lerobot_args, config]
      properties:
        schema_version: {type: string, const: '1'}
        run_id: {type: string, format: uuid}
        attempts:
          type: array
          items:
            type: object
            required: [attempt, started_at, gpu_id]
            properties:
              attempt: {type: integer}
              started_at: {type: string, format: date-time}
              finished_at: {type: [string, 'null'], format: date-time}
              gpu_id: {type: string}
              resumed_from_step: {type: [integer, 'null']}
              exit_code: {type: [integer, 'null']}
              error_code: {type: [string, 'null']}
        lerobot_version: {type: string}
        torch_version: {type: string}
        cuda_version: {type: string}
        python_version: {type: string}
        image_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        hibiscus_version: {type: string}
        gpu:
          type: object
          required: [id, name, compute_capability]
          properties:
            id: {type: string}
            name: {type: string}
            compute_capability: {type: string}
            driver_version: {type: string}
        dataset:
          type: object
          required: [dataset_id, version_id, version, content_hash, repo_id]
          properties:
            dataset_id: {type: string, format: uuid}
            version_id: {type: string, format: uuid}
            version: {type: integer}
            content_hash: {$ref: '#/components/schemas/Sha256Hex'}
            repo_id: {type: string, examples: [local/so101_picknplace_20261114]}
        seed: {type: integer}
        heldout_episodes:
          type: array
          items: {type: integer}
        train_episodes:
          type: array
          items: {type: integer}
        mixed_precision: {$ref: '#/components/schemas/MixedPrecision'}
        lerobot_args:
          type: array
          items: {type: string}
        config: {$ref: '#/components/schemas/RunConfig'}

    # ------------------------------------------------------------------------------------------
    # Run event stream (SSE) - payload schemas by `event` name
    # ------------------------------------------------------------------------------------------
    RunEventType:
      type: string
      description: Persisted (have SSE id) event types
      enum: [status, metrics, checkpoint, warning, error, model, eval]
    RunEventRecord:
      type: object
      required: [seq, type, ts, attempt, data]
      properties:
        seq: {type: integer}
        type: {$ref: '#/components/schemas/RunEventType'}
        ts: {type: string, format: date-time}
        attempt: {type: integer}
        level: {type: string, enum: [debug, info, warning, error]}
        data:
          oneOf:
            - $ref: '#/components/schemas/RunStatusEvent'
            - $ref: '#/components/schemas/MetricsEvent'
            - $ref: '#/components/schemas/CheckpointEvent'
            - $ref: '#/components/schemas/RunWarningEvent'
            - $ref: '#/components/schemas/RunErrorEvent'
            - $ref: '#/components/schemas/ModelEvent'
            - $ref: '#/components/schemas/EvalEvent'
    RunStreamEvent:
      description: |
        Documentation schema for one SSE message on /runs/{run_id}/events. `event` is the SSE
        `event:` field, `data` the JSON in `data:`, `id` the SSE `id:` (persisted events only).
      type: object
      required: [event, data]
      properties:
        id: {type: integer, description: run_events.seq}
        event:
          type: string
          enum: [status, metrics, checkpoint, warning, error, model, eval, progress, log, telemetry, heartbeat, end]
        data:
          oneOf:
            - $ref: '#/components/schemas/RunStatusEvent'
            - $ref: '#/components/schemas/MetricsEvent'
            - $ref: '#/components/schemas/CheckpointEvent'
            - $ref: '#/components/schemas/RunWarningEvent'
            - $ref: '#/components/schemas/RunErrorEvent'
            - $ref: '#/components/schemas/ModelEvent'
            - $ref: '#/components/schemas/EvalEvent'
            - $ref: '#/components/schemas/ProgressEvent'
            - $ref: '#/components/schemas/LogEvent'
            - $ref: '#/components/schemas/TelemetryEvent'
            - $ref: '#/components/schemas/Heartbeat'
            - $ref: '#/components/schemas/EndEvent'
    RunStatusEvent:
      type: object
      required: [kind, run_id, from, to, ts]
      properties:
        kind: {type: string, const: status}
        run_id: {type: string, format: uuid}
        from:
          oneOf:
            - $ref: '#/components/schemas/RunStatus'
            - type: 'null'
        to: {$ref: '#/components/schemas/RunStatus'}
        reason: {type: [string, 'null'], description: 'e.g. user_cancel, user_pause, lease_expired, infra_retry, completed'}
        error_code:
          oneOf:
            - $ref: '#/components/schemas/RunErrorCode'
            - type: 'null'
        attempt: {type: integer}
        gpu_id: {type: [string, 'null']}
        ts: {type: string, format: date-time}
    MetricsEvent:
      type: object
      required: [kind, step, values, ts]
      properties:
        kind: {type: string, const: metrics}
        step: {type: integer, description: Exact step (log-parsing.md §4), never the rounded label}
        values:
          type: object
          description: 'Canonical keys (log-parsing.md §5): loss, grad_norm, lr, data_s, prep_s, update_s, step_s, samples_per_s, gpu_mem_gb, grad_scale, <policy sub-losses>; NaN/Inf => null'
          additionalProperties: {type: [number, 'null']}
        ts: {type: string, format: date-time}
    CheckpointEvent:
      type: object
      required: [kind, step, checkpoint_id, ts]
      properties:
        kind: {type: string, const: checkpoint}
        step: {type: integer}
        checkpoint_id: {type: string, format: uuid}
        size_bytes: {type: integer}
        ts: {type: string, format: date-time}
    RunWarningEvent:
      type: object
      required: [kind, code, message, ts]
      properties:
        kind: {type: string, const: warning}
        code:
          type: string
          enum: [nan_detected, log_silent, parser_mismatch, mixed_precision_forced_no, vram_near_limit, retrying_after_infra_error, heldout_too_small]
        message: {type: string}
        params: {type: object, additionalProperties: true}
        ts: {type: string, format: date-time}
    RunErrorEvent:
      type: object
      required: [kind, code, message, ts]
      properties:
        kind: {type: string, const: error}
        code: {$ref: '#/components/schemas/RunErrorCode'}
        message: {type: string}
        log_excerpt: {type: [string, 'null'], description: 'Last <= 50 log lines'}
        will_retry: {type: boolean}
        ts: {type: string, format: date-time}
    ModelEvent:
      type: object
      required: [kind, model_id, status, ts]
      properties:
        kind: {type: string, const: model}
        model_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/ModelStatus'}
        verified: {type: boolean}
        onnx_status: {$ref: '#/components/schemas/OnnxStatus'}
        ts: {type: string, format: date-time}
    EvalEvent:
      type: object
      required: [kind, step, ts]
      properties:
        kind: {type: string, const: eval}
        step: {type: integer}
        action_mae: {type: number}
        action_mse: {type: number}
        ts: {type: string, format: date-time}
    ProgressEvent:
      type: object
      required: [kind, step, total_steps, ts]
      properties:
        kind: {type: string, const: progress}
        step: {type: integer, description: initial_step + tqdm n}
        total_steps: {type: integer}
        steps_per_s: {type: [number, 'null']}
        eta_s: {type: [number, 'null']}
        ts: {type: string, format: date-time}
    LogEvent:
      type: object
      required: [kind, lines, byte_offset]
      properties:
        kind: {type: string, const: log}
        byte_offset: {type: integer, description: Offset of the first line in the stored log (for GET /logs Range)}
        lines:
          type: array
          maxItems: 500
          items: {type: string}
    TelemetryEvent:
      allOf:
        - $ref: '#/components/schemas/GpuSample'
        - type: object
          required: [kind]
          properties:
            kind: {type: string, const: telemetry}
    Heartbeat:
      type: object
      required: [kind, ts]
      properties:
        kind: {type: string, const: heartbeat}
        ts: {type: string, format: date-time}
    EndEvent:
      type: object
      required: [kind, final_status]
      properties:
        kind: {type: string, const: end}
        final_status: {$ref: '#/components/schemas/RunStatus'}

    # ------------------------------------------------------------------------------------------
    # Models
    # ------------------------------------------------------------------------------------------
    ModelStatus:
      type: string
      enum: [pending, building, ready, failed]
    OnnxStatus:
      type: string
      enum: [not_supported, pending, exporting, passed, failed]
    Verification:
      type: object
      required: [load_ok, parity_ok, manifest_ok, checked_at]
      properties:
        load_ok: {type: boolean, description: PreTrainedPolicy.from_pretrained + processors load and run one select_action}
        lelab_compatible:
          type: [boolean, 'null']
          description: >-
            CR-A5-W1 (QC-ml-1). The same load check passes in the LeLab venv (LeRobot 0.7.1 without
            optional extras) with no extra packages. false = the user must install the packages listed
            in MANIFEST.checks.lelab_requirements first (e.g. diffusers for diffusion). null = not checked
            (bundles built before this field existed). Not part of `verified`.
        parity_ok: {type: [boolean, 'null'], description: null when onnx_status=not_supported (not required for verified)}
        manifest_ok: {type: boolean}
        parity:
          type: [object, 'null']
          description: Summary of onnx/parity_report.json
          properties:
            max_abs_diff: {type: number}
            atol: {type: number}
            rtol: {type: number}
            n_samples: {type: integer}
        checked_at: {type: string, format: date-time}
        details: {type: [string, 'null']}
    Model:
      type: object
      required: [id, workspace_id, name, policy_type, run_id, run_number, step, status, verified, onnx_status, created_at]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        name: {type: string, examples: [so101_picknplace_act-42-step10000]}
        policy_type: {$ref: '#/components/schemas/PolicyType'}
        run_id: {type: string, format: uuid}
        run_number: {type: integer}
        checkpoint_id: {type: string, format: uuid}
        step: {type: integer}
        status: {$ref: '#/components/schemas/ModelStatus'}
        error_message: {type: [string, 'null']}
        verified: {type: boolean}
        verification:
          oneOf:
            - $ref: '#/components/schemas/Verification'
            - type: 'null'
        onnx_status: {$ref: '#/components/schemas/OnnxStatus'}
        onnx_detail: {type: [string, 'null']}
        bundle_size_bytes: {type: [integer, 'null']}
        bundle_sha256: {oneOf: [{$ref: '#/components/schemas/Sha256Hex'}, {type: 'null'}]}
        dataset:
          type: object
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            version: {type: integer}
        eval_summary:
          type: [object, 'null']
          properties:
            action_mae: {type: number}
            action_mse: {type: number}
        hub_repo_id: {type: [string, 'null']}
        hub_pushed_at: {type: [string, 'null'], format: date-time}
        created_by: {$ref: '#/components/schemas/UserRef'}
        created_at: {type: string, format: date-time}
    ModelPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Model'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    BundleManifest:
      type: object
      description: MANIFEST.json (normative JSON Schema in docs/spec/bundle.md §3; this mirrors it)
      required: [schema_version, bundle_name, files]
      properties:
        schema_version: {type: string, const: '1'}
        bundle_name: {type: string}
        files:
          type: array
          items:
            type: object
            required: [path, size, sha256]
            properties:
              path: {type: string}
              size: {type: integer}
              sha256: {$ref: '#/components/schemas/Sha256Hex'}
      additionalProperties: true
    HubPushRequest:
      type: object
      required: [repo_id]
      additionalProperties: false
      properties:
        repo_id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,95}/[A-Za-z0-9][A-Za-z0-9_.-]{0,95}$'}
        private: {type: boolean, default: true}
        include_onnx: {type: boolean, default: false}

    # ------------------------------------------------------------------------------------------
    # GPUs / queue
    # ------------------------------------------------------------------------------------------
    GpuNode:
      type: object
      required: [id, name, total_vram_mb, compute_capability, supports_bf16, status]
      properties:
        id: {type: string, examples: [cuda0, cuda1]}
        name: {type: string, examples: [NVIDIA GeForce RTX 3060, Tesla P40]}
        total_vram_mb: {type: integer}
        compute_capability: {type: string, examples: ['8.6', '6.1']}
        supports_bf16: {type: boolean}
        supports_fast_fp16: {type: boolean}
        status: {type: string, enum: [online, draining, offline, disabled]}
        last_heartbeat_at: {type: [string, 'null'], format: date-time}
        current_run:
          type: [object, 'null']
          description: Null when idle; `id`/`name` null when the run is in another workspace
          properties:
            id: {type: [string, 'null'], format: uuid}
            name: {type: [string, 'null']}
            workspace_id: {type: [string, 'null'], format: uuid}
            step: {type: integer}
            total_steps: {type: integer}
        telemetry:
          oneOf:
            - $ref: '#/components/schemas/GpuSample'
            - type: 'null'
    QueueEntry:
      type: object
      required: [position, policy_type, requested_gpu, queued_at]
      properties:
        position: {type: integer, minimum: 1}
        run_id: {type: [string, 'null'], format: uuid, description: null for other workspaces}
        run_name: {type: [string, 'null']}
        workspace_id: {type: [string, 'null'], format: uuid}
        policy_type: {$ref: '#/components/schemas/PolicyType'}
        requested_gpu: {type: string}
        required_vram_mb: {type: [integer, 'null']}
        queued_at: {type: string, format: date-time}
        estimated_start_at: {type: [string, 'null'], format: date-time}

    # ------------------------------------------------------------------------------------------
    # Admin / ops
    # ------------------------------------------------------------------------------------------
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [is_active, locked_until, last_login_at, workspaces]
          properties:
            is_active: {type: boolean}
            locked_until: {type: [string, 'null'], format: date-time}
            last_login_at: {type: [string, 'null'], format: date-time}
            workspaces:
              type: array
              items: {$ref: '#/components/schemas/Membership'}
    AdminUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminUser'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    AdminUserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        is_active: {type: boolean}
        is_platform_admin: {type: boolean, description: Requires target to have 2FA enabled}
        unlock: {type: boolean, const: true}
        reset_mfa: {type: boolean, const: true, description: Disables TOTP and deletes recovery codes (account recovery)}
    AuditAction:
      type: string
      description: Catalogue in docs/db-schema.md §Audit
      enum:
        - auth.login
        - auth.login_failed
        - auth.logout
        - auth.refresh_reuse
        - auth.password_reset_requested
        - auth.password_reset
        - auth.password_changed
        - auth.mfa_enabled
        - auth.mfa_disabled
        - auth.recovery_codes_regenerated
        - auth.recovery_code_used
        - auth.session_revoked
        - auth.account_locked
        - token.created
        - token.revoked
        - user.registered
        - user.updated
        - admin.user_updated
        - admin.sessions_revoked
        - admin.reset_link_created
        - admin.quota_updated
        - admin.gpu_updated
        - workspace.created
        - workspace.updated
        - workspace.deleted
        - member.role_changed
        - member.removed
        - invite.created
        - invite.revoked
        - invite.accepted
        - dataset.created
        - dataset.deleted
        - dataset_version.created
        - dataset_version.deleted
        - run.created
        - run.cancelled
        - run.paused
        - run.resumed
        - model.downloaded
        - model.file_downloaded
        - model.deleted
        - model.pushed_hub
        - secret.updated
    AuditEvent:
      type: object
      required: [id, created_at, action, outcome]
      properties:
        id: {type: integer}
        created_at: {type: string, format: date-time}
        workspace_id: {type: [string, 'null'], format: uuid}
        actor:
          oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        actor_token_id: {type: [string, 'null'], format: uuid}
        action: {$ref: '#/components/schemas/AuditAction'}
        target_type: {type: [string, 'null']}
        target_id: {type: [string, 'null']}
        outcome: {type: string, enum: [success, failure, denied]}
        ip: {type: [string, 'null']}
        user_agent: {type: [string, 'null']}
        request_id: {type: [string, 'null']}
        details: {type: object, additionalProperties: true}
    AuditEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEvent'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    SystemStatus:
      type: object
      required: [hibiscus_version, lerobot_version, api_version, queue_depth, gpus, storage, email]
      properties:
        hibiscus_version: {type: string}
        lerobot_version: {type: string}
        api_version: {type: string, const: 0.1.0}
        queue_depth: {type: integer}
        gpus:
          type: array
          items: {$ref: '#/components/schemas/GpuNode'}
        storage:
          type: object
          properties:
            buckets:
              type: object
              additionalProperties: {type: integer, description: bytes}
            disk_free_bytes: {type: integer}
        email:
          type: object
          required: [provider, enabled]
          properties:
            provider: {type: string, enum: [none, smtp, resend, ses, cloudflare]}
            enabled: {type: boolean}
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        checks:
          type: object
          additionalProperties:
            type: object
            required: [ok]
            properties:
              ok: {type: boolean}
              latency_ms: {type: number}
              detail: {type: string}
