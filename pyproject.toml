[project]
name = "hibiscus-station"
version = "0.2.10"
description = "Hibiscus Station: the robot-side app for SO-100/SO-101 arms (calibrate, cameras, teleop, record, upload, run models, trajectories and block programs) with motor health telemetry"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "ASSETS-LICENSE", "NOTICE"]
authors = [{ name = "Bigkatoan" }]
keywords = ["robotics", "lerobot", "so-101", "so-100", "teleoperation", "imitation-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Pinned per ADR-3 (same commit as worker/pyproject.toml).
    "lerobot[feetech,dataset] @ git+https://github.com/huggingface/lerobot.git@fe1c54594f6ba275fccf210b9f7b11f0e2324b89",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "keyring>=24",
    "platformdirs>=4",
    "httpx>=0.27,<0.29",
    "typer>=0.12,<1",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9,<4.14",
    "numpy>=2.0,<2.3",
    # The Hibiscus CLI: Uploader, Puller, HibiscusApi and credentials are reused, not copied.
    "hibiscus @ git+https://github.com/Bigkatoan/Hibiscus.git@v0.1.1#subdirectory=cli",  # not on PyPI
    # station-programs.md §4: ONNX image classifiers (CPU) and the optional MQTT signal client.
    "onnxruntime==1.32.0",
    "paho-mqtt==2.2.0",
]

[project.optional-dependencies]
realsense = ["lerobot[intelrealsense] @ git+https://github.com/huggingface/lerobot.git@fe1c54594f6ba275fccf210b9f7b11f0e2324b89"]
smolvla = ["lerobot[smolvla] @ git+https://github.com/huggingface/lerobot.git@fe1c54594f6ba275fccf210b9f7b11f0e2324b89"]
diffusion = ["lerobot[diffusion] @ git+https://github.com/huggingface/lerobot.git@fe1c54594f6ba275fccf210b9f7b11f0e2324b89"]
pi = ["lerobot[pi] @ git+https://github.com/huggingface/lerobot.git@fe1c54594f6ba275fccf210b9f7b11f0e2324b89"]

[project.urls]
Homepage = "https://github.com/Bigkatoan/hibiscus-station"
Source = "https://github.com/Bigkatoan/hibiscus-station"
Issues = "https://github.com/Bigkatoan/hibiscus-station/issues"
Changelog = "https://github.com/Bigkatoan/hibiscus-station/blob/main/CHANGELOG.md"
"Hibiscus server" = "https://github.com/Bigkatoan/Hibiscus"

[project.scripts]
hibiscus-station = "hibiscus_station.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # lerobot 0.7.1 is not on PyPI: pinned git rev

[tool.hatch.build.targets.wheel]
packages = ["hibiscus_station"]
artifacts = ["hibiscus_station/static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["hibiscus_station", "README.md", "pyproject.toml", "hatch_build.py", "openapi.json", "LICENSE", "ASSETS-LICENSE", "NOTICE"]
artifacts = ["hibiscus_station/static/**"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "respx>=0.21",
    "jsonschema>=4.23",
    # End-to-end UI test (tests/e2e, marker e2e; skipped when no browser is installed).
    "playwright==1.65.2",
    # Builds the tiny classifier models the detector tests run through onnxruntime.
    "onnx==1.23.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "hil: needs real SO-101 hardware (manual)",
    "slow: > 30 s",
    "e2e: drives the built UI against a real hibiscus-station with Playwright",
]
addopts = "-m 'not hil and not slow and not e2e'"
timeout = 300

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S311", "E501"]
# vendored unchanged from the Hibiscus CLI tests (v0.1.1): operation-id method names, Python 3.10 style
"tests/fake_server.py" = ["N802", "UP017"]
"hibiscus_station/mock/**" = ["S311"]
"hibiscus_station/api/**" = ["B008"]
"hibiscus_station/cli.py" = ["B008"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["^tests/", "^hatch_build\\.py$"]

[[tool.mypy.overrides]]
module = ["lerobot.*", "torch.*", "torchvision.*", "draccus.*", "cv2.*", "serial.*", "keyring.*", "safetensors.*", "peft.*", "pyarrow.*", "rustypot.*", "onnxruntime.*", "onnx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hibiscus", "hibiscus.*"]
ignore_missing_imports = true
follow_imports = "skip"
